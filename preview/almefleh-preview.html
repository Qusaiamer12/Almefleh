      { label: 'النوع', render: (v) => h('span.pill', { class: KIND_PILL[v.kind] || '' }, v.kind_label) },
      { label: 'الجهة', render: (v) => v.entity_name || 'المستودع' },
      { label: 'الأصناف', cls: 'num', render: (v) => countItems(v.line_count) },
      { label: 'المبلغ', cls: 'num', render: (v) => {
        if (!PRICED_KINDS.has(v.kind)) return '—';   // بضاعة داخلية: كميات بلا فلوس
        if (v.pending_price_lines) return h('span.pill.warn', {}, `${v.pending_price_lines} سعر معلّق`);
        return money(v.total_amount);
      } },
      { label: 'سجّله', render: (v) => v.created_by_name || '—' },
      { label: 'ملاحظة', render: (v) => v.note || '—' },
      { label: '', render: (v) => h('div.row', { style: 'flex-wrap:nowrap' },
          h('button.btn.ghost.sm', { onclick: () => openVoucherSheet(v) }, 'الجرد'),
          editable ? h('button.btn.danger.sm', { onclick: () => removeVoucher(v, refresh) }, 'حذف') : null) },
    ];
    box.append(h('div.card', {},
      h('div.toolbar', {},
        h('h3', {}, 'السندات'),
        h('div.spacer'),
        h('button.btn.ghost.sm', {
          onclick: () => downloadCsv('vouchers.csv',
            ['رقم السند', 'التاريخ', 'النوع', 'الجهة', 'عدد الأصناف', 'المبلغ', 'سجّله', 'ملاحظة'],
            vouchers.map((v) => [v.voucher_no, dateTime(v.occurred_at), v.kind_label,
              v.entity_name || 'المستودع', v.line_count,
              PRICED_KINDS.has(v.kind) ? (v.total_amount ?? '') : '', v.created_by_name || '', v.note || ''])),
        }, icon('download', 14), 'تصدير')),
      table(columns, vouchers, { empty: 'ما في سندات بهاي الفترة' })));
  }

  await refresh();
}

/** جرد سند كامل: كل أسطره بكمياتها ومبالغها */
async function openVoucherSheet(summary) {
  const { voucher, lines } = await api.get(`/api/vouchers/${summary.id}`);
  const priced = PRICED_KINDS.has(voucher.kind) && voucher.total_amount !== undefined;
  return modal({
    title: `جرد سند #${voucher.voucher_no}`,
    confirmText: 'تمام',
    cancelText: 'إغلاق',
    wide: true,
    body: h('div', {},
      h('div.confirm-bar', {},
        h('span.pill', { class: KIND_PILL[voucher.kind] || '' }, voucher.kind_label),
        h('b', {}, voucher.entity_name || 'المستودع'),
        h('span.muted', {}, '·'),
        h('span', {}, dateTime(voucher.occurred_at)),
        h('span.muted', {}, '·'),
        h('b', {}, countItems(voucher.line_count))),
      voucher.note ? h('div.muted', { style: 'margin-bottom:10px' }, voucher.note) : null,
      table([
        { label: '#', render: (l) => String(l._i + 1) },
        { label: 'الصنف', key: 'item_name' },
        { label: 'الكمية', cls: 'num', render: (l) => qty(l.quantity, l.item_unit) },
        // أعمدة الفلوس بتظهر بسندات الزباين بس
        ...(priced ? [
          { label: 'سعر الوحدة', cls: 'num', render: (l) => (l.price_pending
              ? h('span.pill.warn', {}, 'معلّق') : money(l.unit_price)) },
          { label: 'المبلغ', cls: 'num', render: (l) => money(l.amount) },
        ] : []),
        { label: 'ملاحظة', render: (l) => l.note || '—' },
      ], lines.map((l, i) => ({ ...l, _i: i })), { empty: 'ما ضل ولا سطر بالسند' }),
      priced && voucher.total_amount != null
        ? h('div.confirm-bar', { style: 'margin-top:12px' },
            h('b', {}, 'إجمالي السند'), h('div.spacer'), h('b', {}, money(voucher.total_amount)))
        : null),
  });
}

async function removeVoucher(v, refresh) {

function renderLogin(root, onSuccess) {
  clear(root);

  const username = h('input', { type: 'text', name: 'username', autocomplete: 'username', required: true, autocapitalize: 'off' });
  const password = h('input', { type: 'password', name: 'password', autocomplete: 'current-password', required: true });
  const error = h('div.alert.danger', { style: 'display:none' });
  const button = h('button.btn', { type: 'submit' }, 'دخول');

  const logoImg = h('img.logo', { src: state.logo, alt: 'المفلح' });

  const form = h('form', {
    onsubmit: async (e) => {
      e.preventDefault();
      error.style.display = 'none';
      button.disabled = true;
      button.textContent = 'جاري الدخول…';
      try {
        await api.login(username.value.trim(), password.value);
        toast('أهلاً فيك');
        onSuccess();
      } catch (err) {
        error.textContent = err.message;
        error.style.display = 'block';
        password.value = '';
        password.focus();
      } finally {
        button.disabled = false;
        button.textContent = 'دخول';
      }
    },
  },
    h('label.field', {}, 'اسم المستخدم', username),
    h('label.field', {}, 'كلمة السر', password),
    error,
    button);

  root.append(h('div.login-wrap', {},
    h('div.login-card', {},
      logoImg,
      h('h1', {}, 'نظام مستودعات المفلح'),
      h('p.tagline', {}, 'إدارة المخزون وكشوفات الحسابات'),
      form)));

  setTimeout(() => username.focus(), 50);
}

// ================= اللوحة =================
async function renderDashboard(root, ctx) {
  clear(root);
  const [stock, statements, proposals, requests, pending] = await Promise.all([
    api.get('/api/stock'),
    api.get('/api/statements'),
    api.get('/api/proposals', { status: 'pending' }),
    api.get('/api/requests', { open_only: 'true' }),
    api.get('/api/transactions', { pending_price: 'true', limit: 50 }),
  ]);

  root.append(h('div.grid.cols-4', {},
    stat('إجمالي ديون الزباين', money(statements.totals.balance)),
    stat('قيمة الستوك', money(stock.summary.total_value)),
    stat('أصناف تحت الصفر', stock.summary.negative_count, stock.summary.negative_count > 0),
    stat('حركات بسعر معلّق', pending.transactions.length, pending.transactions.length > 0)));

  if (proposals.proposals.length) {
    root.append(h('div.card', {},
      h('h3', {}, '🔔 اقتراحات تعديل أسعار بانتظار قرارك'),
      table([
        { label: 'الصنف', key: 'parent_name' },
        { label: 'السبب', render: (r) => `تغيّر سعر "${r.component_name}" من ${r.old_component_price ?? '—'} إلى ${r.new_component_price}` },
        { label: 'السعر الحالي', cls: 'num', render: (r) => money(r.current_parent_price) },
        { label: 'تكلفة المقادير', cls: 'num', render: (r) => money(r.cost_price) },
        { label: 'المقترح', cls: 'num', render: (r) => h('b', {}, money(r.suggested_price)) },
        { label: 'من تاريخ', render: (r) => dateOnly(r.effective_from) },
        { label: '', render: (r) => h('div.row', {},
          h('button.btn.sm', { onclick: () => acceptProposal(r, ctx) }, 'وافق'),
          h('button.btn.ghost.sm', {
            onclick: async () => { await api.post(`/api/proposals/${r.id}/reject`); toast('انرفض الاقتراح'); ctx.go('dashboard'); },
          }, 'ارفض')) },
      ], proposals.proposals)));
  }

  if (pending.transactions.length) {
    root.append(h('div.card', {},
      h('h3', {}, '⏳ حركات بسعر معلّق', h('span.sub', {}, 'حدّد سعر الصنف وبتنحسب تلقائياً')),
      table([
        { label: 'التاريخ', render: (r) => dateTime(r.occurred_at) },
        { label: 'الزبون', key: 'entity_name' },
        { label: 'الصنف', key: 'item_name' },
        { label: 'الكمية', cls: 'num', render: (r) => qty(r.quantity, r.item_unit) },
        { label: '', render: (r) => h('button.btn.gold.sm', {
          onclick: () => openPriceDialog({ id: r.item_id, name: r.item_name }, () => ctx.go('dashboard')),
        }, 'حدّد السعر') },
      ], pending.transactions)));
  }

  if (requests.requests.length) {
    root.append(h('div.card', {},
      h('h3', {}, '✉ طلبات وملاحظات الزباين'),
      table([
        { label: 'الزبون', key: 'entity_name' },
        { label: 'الطلب', key: 'body' },
        { label: 'التاريخ', render: (r) => dateTime(r.created_at) },
        { label: '', render: (r) => h('button.btn.ghost.sm', {
          onclick: async () => { await api.patch(`/api/requests/${r.id}`, { handled: true }); toast('تم'); ctx.go('dashboard'); },
        }, 'تم التعامل معه') },
      ], requests.requests)));
  }

  // آخر النشاط - بيعطي اللوحة معنى بدل ما تكون أرقام معلّقة بالفراغ
  const { transactions } = await api.get('/api/transactions', { limit: 6 });
  root.append(h('div.card', {},
    h('h3', {}, 'آخر الحركات',
      h('span.sub', {}, 'آخر ٦ حركات على المستودع'),
      h('div', { style: 'flex:1' }),
      h('button.btn.ghost.sm', { onclick: () => ctx.go('transactions') }, 'كل الحركات')),
    entryList(transactions)));

  const negatives = stock.items.filter((i) => i.negative);
  if (negatives.length) {
    root.append(h('div.card', {},
      h('h3', { style: 'color:#B3261E' }, '⚠ أصناف رصيدها تحت الصفر'),
      table([
        { label: 'الصنف', key: 'item_name' },
        { label: 'الرصيد', cls: 'num', render: (r) => qty(r.quantity, r.unit) },
      ], negatives, { rowClass: () => 'neg' })));
  }
}

async function acceptProposal(proposal, ctx) {
  const price = h('input', { type: 'number', step: '0.01', value: proposal.suggested_price ?? '' });
  const effective = h('input', { type: 'date', value: dateOnly(proposal.effective_from) });
  const result = await modal({
    title: `تعديل سعر ${proposal.parent_name}`,
    confirmText: 'اعتمد السعر',
    body: h('div.grid', {},
      h('div.muted', {}, `تكلفة المقادير الجديدة: ${money(proposal.cost_price)} — السعر الحالي: ${money(proposal.current_parent_price)}`),
      h('label.field', {}, 'السعر الجديد', price),
      h('label.field', {}, 'يسري من تاريخ', effective),
      h('div.alert.warn', {}, 'كل الحركات من هذا التاريخ وجاي بتتحدّث تلقائياً بالسعر الجديد.')),
    onConfirm: async () => {
      await api.post(`/api/proposals/${proposal.id}/accept`, {
        price: Number(price.value),
        effective_from: inputToIso(effective.value),
      });
      toast('تم تعديل السعر');
    },
  });
  if (result) ctx.go('dashboard');
}

async function renderAdminTransactions(root, ctx) {

    ctx,
    editable: true,
    onEdit: (txn, refresh) => openEditTransaction(txn, refresh),
    onDelete: async (txn, refresh) => {

        `حذف ${txn.kind_label} — ${txn.entity_name || 'المستودع'} — ${txn.item_name || money(txn.payment_amount)}؟ الأرصدة بتتحدّث تلقائياً.`,
        'حذف');

function openEditTransaction(txn, refresh) {
  const isPayment = txn.kind === 'payment';
  const quantity = h('input', { type: 'text', value: txn.quantity_input || txn.quantity || '' });
  const amount = h('input', { type: 'text', value: txn.payment_amount ?? '' });
  const override = h('input', { type: 'number', step: '0.01', value: txn.price_overridden ? txn.unit_price : '' });
  const when = h('input', { type: 'datetime-local', value: toDateTimeInput(txn.occurred_at) });
  const note = h('input', { type: 'text', value: txn.note || '' });

  return modal({
    title: `تعديل حركة #${txn.id}`,
    confirmText: 'حفظ',
    body: h('div.grid', {},
      h('div.muted', {}, `${txn.kind_label} — ${txn.entity_name || 'المستودع'} — ${txn.item_name || ''}`),
      isPayment ? h('label.field', {}, 'المبلغ', amount) : h('label.field', {}, 'الكمية', quantity),
      isPayment ? null : h('label.field', {}, 'سعر استثنائي لهاي الحركة (اختياري)', override),
      h('label.field', {}, 'التاريخ والوقت', when),
      h('label.field', {}, 'ملاحظة', note),
      h('div.alert.warn', {}, 'التعديل بينسجّل بسجل التدقيق وبيعيد حساب الأرصدة رجوعاً وللأمام.')),
    onConfirm: async () => {
      const payload = { note: note.value.trim(), occurred_at: inputToIso(when.value) };
      if (isPayment) payload.payment_amount = amount.value.trim();
      else {
        payload.quantity = quantity.value.trim();
        payload.unit_price_override = override.value === '' ? null : Number(override.value);
      }
      const result = await api.patch(`/api/transactions/${txn.id}`, payload);
      if (result.warnings?.length) toast(result.warnings[0].message, true);
      toast('تم التعديل');
      refresh();
    },
  });
}

/** تغيير السعر - بيسأل دايماً "من متى" */
function openPriceDialog(item, refresh) {
  const price = h('input', { type: 'number', step: '0.01', min: '0', placeholder: 'السعر الجديد' });
  const effective = h('input', { type: 'date', value: todayString() });
  const note = h('input', { type: 'text', placeholder: 'سبب التغيير (اختياري)' });
  const preview = h('div.muted');

  const modeRow = h('div.row', {},
    h('button.btn.ghost.sm', { onclick: () => { effective.value = todayString(); update(); } }, 'من اليوم'),
    h('button.btn.ghost.sm', {
      onclick: () => { effective.value = weekStartString(); update(); },
    }, 'من بداية الأسبوع'));

  const update = () => {
    preview.textContent = `الحركات من ${effective.value} وجاي بتتحسب بالسعر الجديد، واللي قبله بتضل بسعرها القديم.`;
  };
  effective.addEventListener('change', update);
  update();

  return modal({
    title: `تغيير سعر: ${item.name}`,
    confirmText: 'حفظ السعر',
    body: h('div.grid', {},
      h('label.field', {}, 'السعر الجديد', price),
      h('label.field', {}, 'يسري من تاريخ', effective),
      modeRow,
      h('label.field', {}, 'ملاحظة', note),
      preview),
    onConfirm: async () => {
      if (price.value === '') throw new Error('أدخل السعر');
      const result = await api.post(`/api/items/${item.id}/prices`, {
        price: Number(price.value),
        effective_from: inputToIso(effective.value),
        note: note.value.trim() || undefined,
      });
      let message = `تم. ${result.affected_transactions} حركة تحدّثت.`;
      if (result.proposals?.length) message += ` وفي ${result.proposals.length} صنف مرتبط بده قرار منك.`;
      toast(message);
      refresh?.();
    },
  });
}

function openNewItem(refresh) {
  const name = h('input', { type: 'text' });
  const unit = h('select', {}, h('option', { value: 'piece' }, 'بالعدد'), h('option', { value: 'kg' }, 'بالوزن'));
  const price = h('input', { type: 'number', step: '0.01', placeholder: 'اختياري' });
  return modal({
    title: 'صنف جديد',
    confirmText: 'إضافة',
    body: h('div.grid', {},
      h('label.field', {}, 'اسم الصنف', name),
      h('label.field', {}, 'وحدة القياس', unit),
      h('label.field', {}, 'السعر', price)),
    onConfirm: async () => {

        name: name.value.trim(), unit: unit.value,

function openEditItem(item, refresh) {

        name: name.value.trim(), unit: unit.value, active: active.checked,
      });
      toast('تم التعديل');
      refresh();

  const { items } = await api.get('/api/items');
  const select = h('select', { onchange: () => load(Number(select.value)) },
    h('option', { value: '' }, 'اختار صنف…'),
    items.map((i) => h('option', { value: i.id }, i.name)));
  const box = h('div');

  root.append(h('div.card.no-print', {},
    h('h3', {}, 'مقادير الأصناف', h('span.sub', {}, 'شو بده الصنف الجاهز من مواد خام لكل وحدة')),
    h('div.row', {}, h('label.field', {}, 'الصنف الجاهز', select))), box);

  async function load(itemId) {
    clear(box);
    if (!itemId) return;
    const item = items.find((i) => i.id === itemId);
    const data = await api.get(`/api/items/${itemId}/recipe`);
    const rows = data.components.map((c) => ({ ...c }));

    const listBox = h('div');
    const drawList = () => {
      clear(listBox);
      listBox.append(table([
        { label: 'المكوّن', key: 'component_name' },
        { label: 'الكمية لكل وحدة', cls: 'num', render: (r) => qty(r.quantity_per_unit, r.component_unit) },
        { label: '', render: (r) => h('button.btn.danger.sm', {
          onclick: () => { rows.splice(rows.indexOf(r), 1); drawList(); },
        }, 'حذف') },
      ], rows, { empty: 'ما في مقادير محدّدة لهذا الصنف' }));
    };
    drawList();

    const componentSelect = h('select', {},
      items.filter((i) => i.id !== itemId).map((i) => h('option', { value: i.id }, i.name)));
    const quantityInput = h('input', { type: 'number', step: '0.0001', min: '0', placeholder: 'الكمية' });

    box.append(h('div.card', {},
      h('h3', {}, `مقادير: ${item.name}`),
      h('div.grid.cols-4', { style: 'margin-bottom:12px' },
        stat('تكلفة المقادير', money(data.cost)),
        stat('سعر البيع الحالي', money(data.current_price)),
        stat('هامش الربح', money(data.margin))),
      !data.cost_complete && data.components.length
        ? h('div.alert.warn', {}, 'في مكوّن ما إله سعر — التكلفة مش كاملة.') : null,
      listBox,
      h('div.row', { style: 'margin-top:12px' },
        h('label.field', {}, 'مكوّن', componentSelect),
        h('label.field', {}, 'الكمية لكل وحدة', quantityInput),
        h('button.btn.ghost', {
          onclick: () => {
            const id = Number(componentSelect.value);
            const q = Number(quantityInput.value);
            if (!(q > 0)) return toast('أدخل كمية صحيحة', true);
            if (rows.some((r) => r.component_item_id === id)) return toast('المكوّن مضاف مسبقاً', true);
            const src = items.find((i) => i.id === id);
            rows.push({ component_item_id: id, component_name: src.name, component_unit: src.unit, quantity_per_unit: q });
            quantityInput.value = '';
            drawList();
          },
        }, '+ إضافة مكوّن')),
      h('div.row', { style: 'margin-top:14px' },
        h('button.btn', {
          onclick: async () => {
            await api.put(`/api/items/${itemId}/recipe`, {
              components: rows.map((r) => ({ component_item_id: r.component_item_id, quantity_per_unit: r.quantity_per_unit })),
            });
            toast('انحفظت المقادير');
            load(itemId);
          },
        }, 'حفظ المقادير'))));
  }
}

function openEditUser(user, refresh) {
  const username = h('input', { type: 'text', value: user.username });
  const password = h('input', { type: 'text', placeholder: 'اتركها فاضية إذا ما بدك تغيّرها' });
  const active = h('input', { type: 'checkbox', checked: user.active });
  const notifications = h('input', { type: 'checkbox', checked: user.notifications_on });

  return modal({
    title: `تعديل حساب: ${user.display_name}`,
    confirmText: 'حفظ',
    body: h('div.grid', {},
      h('label.field', {}, 'اسم المستخدم', username),
      h('label.field', {}, 'كلمة سر جديدة', password),
      h('label.field', {}, h('span', {}, 'فعّال'), active),
      h('label.field', {}, h('span', {}, 'يستقبل تنبيهات'), notifications)),
    onConfirm: async () => {
      const payload = {
        username: username.value.trim(), active: active.checked,
        notifications_on: notifications.checked,
      };
      if (password.value) payload.password = password.value;
      await api.patch(`/api/users/${user.id}`, payload);
      toast('تم التعديل');
      refresh();
    },
  });
}

const ARABIC_LETTERS = 'أبتثجحخدذرزسشصضطظعغفقكلمنهوي'.split('');

/** تطبيع عربي مطابق للي بقاعدة البيانات: "شطه" = "شطة"، وبلا مسافات */
function normalizeAr(text) {
  return String(text || '').toLowerCase()
    .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/[ىئ]/g, 'ي').replace(/ؤ/g, 'و')
    .replace(/[ً-ْـ]/g, '')
    .replace(/\s+/g, '');
}
const trimNum = (n) => String(Number(n)).replace(/\.0+$/, '');

/** الكميات الأكتر استعمالاً - ضغطة وحدة بدل كتابة */
const QUICK = [1, 2, 3, 4, 5, 6, 10, 12, 20, 24, 25, 50];

/**
 * مُدخل كمية موحّد: كميات جاهزة بضغطة + لوحة أرقام للباقي.
 * الهدف تقليل الكتابة قدر الإمكان - الكتابة هي مصدر الغلط.
 * @returns {{ el: HTMLElement, get: () => string }}
 */
function quantityInput(item, initial = '') {
  let value = String(initial || '');
  const display = h('div.qty-display', {}, value || '0');
  const update = () => { display.textContent = value || '0'; };

  const press = (key) => {
    if (key === 'C') value = '';
    else if (key === '⌫') value = value.slice(0, -1);
    else if (key === '.') { if (!value.includes('.') && value) value += '.'; }
    else if (key === 'ك' || key === 'غ') { if (value && !/[كغ]$/.test(value)) value += key; }
    else value += key;
    update();
  };

  const quick = h('div.quick-qty', {}, QUICK.map((n) => h('button', {
    type: 'button', onclick: () => { value = String(n); update(); },
  }, String(n))));

  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', '⌫'];
  const pad = h('div.keypad', {}, keys.map((k) => h('button', { type: 'button', onclick: () => press(k) }, k)));
  const unitRow = item.unit === 'kg'
    ? h('div.keypad', {},
        h('button', { type: 'button', onclick: () => press('ك') }, 'كيلو'),
        h('button', { type: 'button', onclick: () => press('غ') }, 'غرام'),
        h('button', { type: 'button', onclick: () => press('C') }, 'مسح'))
    : h('div.keypad', {}, h('button', { type: 'button', style: 'grid-column:1/-1', onclick: () => press('C') }, 'مسح'));

  // الأصناف بالعدد: الكميات الجاهزة بتغطّي معظم الحالات، فلوحة الأرقام مطويّة
  // عشان زر التأكيد يضل باين بلا سحب. أصناف الوزن بتحتاجها غالباً فبتضل مفتوحة.
  const byWeight = item.unit === 'kg';
  const padBox = h('div', { style: byWeight ? '' : 'display:none' }, pad, unitRow);
  const toggle = h('button.btn.ghost.sm', {
    type: 'button', style: byWeight ? 'display:none' : '',
    onclick: () => { padBox.style.display = ''; toggle.style.display = 'none'; },
  }, 'رقم تاني…');

  const el = h('div', {},
    display,
    h('div.qty-label', {}, 'الأكتر استعمالاً'),
    quick,
    h('div.row', { style: 'margin-top:10px' }, toggle),
    padBox);

  return { el, get: () => value };
}

/** رمز فريد لكل سند - بيمنع تثبيت نفس السند مرتين */
function newToken() {
  if (crypto.randomUUID) return crypto.randomUUID().replace(/-/g, '');
  return `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 12)}`;
}

const RECORDER_NAV = [
  { key: 'record', label: 'تسجيل سند', title: 'تسجيل السندات', icon: 'cashier', render: renderRecorder },
];

/** المستودع نفسه: التوريد بيدخل عليه من برّا، فما إله جهة */
const WAREHOUSE = { id: null, name: 'المستودع', type: 'warehouse' };

/** نوع الحركة = الجهة + الاتجاه */
function resolveKind(party, direction) {
  if (party.type === 'warehouse') return 'supply';
  if (party.type === 'operator') return direction === 'out' ? 'operator_out' : 'operator_in';
  return direction === 'out' ? 'customer_out' : 'customer_return';
}

const DIRECTION_LABELS = {
  operator: { out: 'إخراج للمشغل', in: 'إدخال من المشغل' },
  customer: { out: 'سحب بضاعة', in: 'إرجاع بضاعة' },
};
const DIRECTION_HINTS = {
  operator: { out: 'مواد خام طالعة للتصنيع', in: 'بضاعة جاهزة راجعة' },
  customer: { out: 'بضاعة طالعة للزبون', in: 'بضاعة راجعة منه' },
};

/** عنوان السند: "سحب بضاعة — بلال" */
function voucherTitle(party, direction) {
  if (!party) return 'سند';
  if (party.type === 'warehouse') return 'توريد للمستودع';
  return `${DIRECTION_LABELS[party.type][direction]} — ${party.name}`;
}

/**
 * شاشة تسجيل السندات (آيباد).
 * التدفّق كله بالضغط - الكتابة هي مصدر الغلط:
 *   جهة => اتجاه => أصناف (سطر ورا سطر بالسند) => جرد كلي للمراجعة => تثبيت
 * السند بينحفظ كله مرّة وحدة: يا كل الأسطر يا ولا وحدة.
 * التوريد بيتخطّى خطوة الاتجاه (دايماً بضاعة داخلة) وما إله جهة.
 * الدفعات مش هون - شغل مالي بيتسجّل من حساب المدير.
 */
async function renderRecorder(root) {
  clear(root);

  const ui = {
    party: null,        // الجهة المختارة
    direction: null,    // 'in' | 'out'
    family: null,       // عائلة المنتج المفتوحة
    search: '',
    letter: '',
    items: [],
    entities: [],
    activeLetters: new Set(),
    // --- السند المفتوح ---
    basket: [],         // [{ item, quantity, note }]
    token: null,        // رمز السند - بيتجدّد مع كل سند جديد
    note: '',           // ملاحظة السند
  };

  const banner = h('div');
  const steps = h('div');
  const picker = h('div');       // البحث + شبكة الأصناف + بار الحروف
  const basketBar = h('div');    // شريط السند المفتوح (ثابت تحت)
  const recentBox = h('div.recent');

  root.append(banner, steps, picker,
    h('div.card', { style: 'margin-top:16px' },
      h('h3', {}, 'آخر السندات اللي سجّلتها'), recentBox),
    basketBar);

  // ================= تحميل =================
  async function loadEntities() {
    const { entities } = await api.get('/api/users/entities');
    // المشغل أول، وبعدين الزباين
    ui.entities = entities.sort((a, b) => (a.type === b.type ? 0 : a.type === 'operator' ? -1 : 1));
    drawSteps();
  }
  async function loadItems() {
    const { items } = await api.get('/api/items');
    ui.items = items;
    ui.activeLetters = new Set(items.map((i) => (i.base || i.name).trim()[0]));
    drawPicker();
  }
  async function loadRecent() {
    const { vouchers } = await api.get('/api/vouchers', { limit: 12, mine: 'true' });
    clear(recentBox);
    if (!vouchers.length) { recentBox.append(h('div.empty', {}, 'ما في سندات بعد')); return; }
    for (const v of vouchers) {
      recentBox.append(h('div.recent-row', {},
        h('span.voucher-no', {}, `سند #${v.voucher_no}`),
        h('span.pill', {}, v.kind_label),
        h('b', {}, v.entity_name || 'المستودع'),
        h('span.grow', {}, countItems(v.line_count)),
        h('span.muted', { style: 'font-size:12px' }, dateTime(v.occurred_at)),
        h('button.btn.ghost.sm', { onclick: () => openVoucher(v) }, 'الجرد'),
        h('button.btn.danger.sm', { onclick: () => deleteVoucher(v) }, 'حذف')));
    }
  }

  /** بداية اختيار جديدة: العائلة المفتوحة والبحث ما لازم يضلوا من الجهة اللي قبل */
  function resetPick() { ui.family = null; ui.search = ''; ui.letter = ''; }

  // ================= السند المفتوح =================
  function startVoucher() {
    ui.basket = [];
    ui.note = '';
    ui.token = newToken();
  }
  function clearVoucher() {
    ui.basket = [];
    ui.note = '';
    ui.token = null;
    drawBasket();
    drawPicker();
  }

  /**
   * تبديل الجهة أو الاتجاه والسند مفتوح بيلغيه - فبنسأل أول.
   * (السند كله على جهة وحدة واتجاه واحد - هيك القاعدة بتفرض كمان)
   */
  async function guardSwitch() {
    if (!ui.basket.length) return true;
    const ok = await modal({
      title: 'في سند مفتوح',
      confirmText: 'إلغاء السند',
      cancelText: 'رجوع للسند',
      body: h('div', {},
        h('div.confirm-bar', {},
          h('span.pill', {}, voucherTitle(ui.party, ui.direction)),
          h('b', {}, countItems(ui.basket.length))),
        h('p', {}, 'إذا بدّلت الجهة أو الاتجاه بينلغي السند المفتوح وأصنافه.'),
        h('div.alert.warn', {}, 'السند الواحد بيكون على جهة وحدة واتجاه واحد.')),
    });
    if (!ok) return false;
    clearVoucher();
    return true;
  }

  function basketQtyOf(item) {
    return ui.basket.filter((l) => l.item.id === item.id).length;
  }

  function addLine(item, quantity, note) {
    if (!ui.token) startVoucher();
    ui.basket.push({ item, quantity, note: note || '' });
    drawBasket();
  }

  function drawBasket() {
    clear(basketBar);
    // مساحة تحت عشان الشريط الثابت ما يغطّي آخر الصفحة
    document.body.classList.toggle('has-voucher-bar', ui.basket.length > 0);
    if (!ui.basket.length) return;

    basketBar.append(h('div.voucher-bar', {},
      h('div.voucher-bar-info', {},
        h('span.voucher-count', {}, String(ui.basket.length)),
        h('span', {},
          h('b', {}, voucherTitle(ui.party, ui.direction)),
          h('small', {}, `${countItems(ui.basket.length)} بالسند — ما انثبّت بعد`))),
      h('div.row', {},
        h('button.btn.ghost', { onclick: () => guardSwitch() }, 'إلغاء'),
        h('button.btn.gold.lg', { onclick: openReview }, icon('check', 16), 'مراجعة وتثبيت'))));
  }

  // ================= الجرد الكلي قبل التثبيت =================
  function openReview() {
    if (!ui.basket.length) { toast('السند فاضي', true); return; }
    const noteInput = h('input', { type: 'text', id: 'voucher-note', value: ui.note,
      placeholder: 'ملاحظة على السند كله (اختياري)' });
    const listBox = h('div.review-lines');

    /** الأصناف المكرّرة بتنعلّم عشان يتأكد إنها مقصودة */
    function duplicates() {
      const seen = new Map();
      for (const line of ui.basket) seen.set(line.item.id, (seen.get(line.item.id) || 0) + 1);
      return seen;
    }

    function drawLines() {
      clear(listBox);
      const dup = duplicates();
      ui.basket.forEach((line, index) => {
        listBox.append(h('div.review-line', {},
          h('span.review-no', {}, String(index + 1)),
          h('span.review-item', {},
            h('b', {}, line.item.name),
            line.note ? h('small', {}, line.note) : null,
            dup.get(line.item.id) > 1 ? h('small.dup', {}, 'هذا الصنف مكرّر بالسند') : null),
          h('span.review-qty', {}, line.quantity,
            h('small', {}, line.item.unit === 'kg' ? 'بالوزن' : 'بالعدد')),
          h('button.btn.ghost.sm', { onclick: () => editLine(index, drawLines) }, 'تعديل'),
          h('button.btn.danger.sm', {
            onclick: () => { ui.basket.splice(index, 1); drawBasket(); drawLines(); },
          }, 'شيل')));
      });
      if (!ui.basket.length) {
        listBox.append(h('div.empty', {}, 'السند صار فاضي - ارجع وضيف أصناف'));
      }
      count.textContent = countItems(ui.basket.length);
    }
    const count = h('b', {}, countItems(ui.basket.length));
    drawLines();

    return modal({
      title: 'الجرد الكلي — راجع قبل ما تثبّت',
      confirmText: 'بثبّت السند',
      cancelText: 'رجوع للسند',
      wide: true,
      body: h('div', {},
        h('div.confirm-bar', {},
          h('span.pill', { class: ui.direction === 'out' ? 'out' : 'in' },
            voucherTitle(ui.party, ui.direction)),
          h('span.muted', {}, '·'),
          count),
        listBox,
        h('label.field', { style: 'margin-top:14px' }, 'ملاحظة السند', noteInput),
        h('div.alert.warn', {}, 'بعد التثبيت بتنحفظ كل الأسطر مرّة وحدة، وبيطلع للسند رقم.')),
      onConfirm: async () => {
        if (!ui.basket.length) throw new Error('السند فاضي');
        ui.note = noteInput.value.trim();
        await commitVoucher();
      },
    });
  }

  /** تعديل كمية سطر قبل التثبيت */
  function editLine(index, after) {
    const line = ui.basket[index];
    const input = quantityInput(line.item, line.quantity);
    const note = h('input', { type: 'text', id: 'line-note', value: line.note || '',
      placeholder: 'ملاحظة على السطر (اختياري)' });
    return modal({
      title: `تعديل: ${line.item.name}`,
      confirmText: 'حفظ',
      body: h('div', {}, input.el, h('label.field', { style: 'margin-top:14px' }, 'ملاحظة', note)),
      onConfirm: () => {
        const value = input.get();
        if (!value) throw new Error('أدخل الكمية');
        line.quantity = value;
        line.note = note.value.trim();
        after();
      },
    });
  }

  /** التثبيت: السند وكل أسطره بنداء واحد - يا كله يا ولا شي */
  async function commitVoucher() {
    const result = await api.post('/api/vouchers', {
      kind: resolveKind(ui.party, ui.direction),
      entity_id: ui.party.id || undefined,
      note: ui.note || undefined,
      client_token: ui.token,
      lines: ui.basket.map((l) => ({
        item_id: l.item.id,
        quantity: l.quantity,
        note: l.note || undefined,
      })),
    });
    showWarnings(result.warnings);
    toast(result.duplicate
      ? `سند #${result.voucher.voucher_no} مثبّت أصلاً - ما انثبّت مرتين`
      : `تم تثبيت سند #${result.voucher.voucher_no} — ${countItems(result.lines.length)}`);
    resetPick();
    clearVoucher();
    loadRecent();
  }

  // ================= الخطوات =================
  function drawSteps() {
    clear(steps);

    // --- الخطوة ١: الجهة ---
    const partyGrid = h('div.party-grid');
    for (const e of ui.entities) {
      partyGrid.append(h('button.party', {
        class: ui.party?.id === e.id ? 'active' : '',
        onclick: async () => {
          if (ui.party?.id === e.id) return;
          if (!await guardSwitch()) return;
          resetPick(); ui.party = e; ui.direction = null; drawSteps(); drawPicker();
        },
      },
        h('span.party-name', {}, e.name),
        h('small', {}, e.type === 'operator' ? 'جهة داخلية' : 'زبون')));
    }

    steps.append(h('div.step', {},
      h('div.step-head', {}, h('span.step-no', {}, '١'), h('b', {}, 'على مين؟')),
      partyGrid,
      h('div.row', { style: 'margin-top:12px' },
        h('button.btn.ghost', {
          class: ui.party?.type === 'warehouse' ? 'active-supply' : '',
          // التوريد ما إله جهة ولا اتجاه - بضغطة بيفتح الأصناف على طول
          onclick: async () => {
            if (ui.party?.type === 'warehouse') return;
            if (!await guardSwitch()) return;
            resetPick(); ui.party = WAREHOUSE; ui.direction = 'in'; drawSteps(); drawPicker();
          },
        }, icon('box', 16), 'توريد للمستودع'))));

    // التوريد بيتخطّى خطوة الاتجاه - دايماً بضاعة داخلة
    if (!ui.party || ui.party.type === 'warehouse') return;

    // --- الخطوة ٢: الاتجاه ---
    const labels = DIRECTION_LABELS[ui.party.type];
    const hints = DIRECTION_HINTS[ui.party.type];
    const dirGrid = h('div.dir-grid');
    for (const dir of ['out', 'in']) {
      dirGrid.append(h('button.dir', {
        class: `${dir} ${ui.direction === dir ? 'active' : ''}`.trim(),
        onclick: async () => {
          if (ui.direction === dir) return;
          if (!await guardSwitch()) return;
          resetPick(); ui.direction = dir; drawSteps(); drawPicker();
        },
      },
        h('span.dir-arrow', {}, dir === 'out' ? '↑' : '↓'),
        h('span', {}, h('b', {}, labels[dir]), h('small', {}, hints[dir]))));
    }
    steps.append(h('div.step', {},
      h('div.step-head', {}, h('span.step-no', {}, '٢'),
        h('b', {}, `${ui.party.name} — إدخال ولا إخراج؟`)),
      dirGrid));
  }

  // ================= الأصناف =================
  function drawPicker() {
    clear(picker);
    if (!ui.party || !ui.direction) return;

    const searchInput = h('input', {
      type: 'search', placeholder: 'دوّر بالاسم — بيقبل "شطه" و"شطة5ك"…', id: 'item-search',
      value: ui.search,
      oninput: (e) => { ui.search = e.target.value.trim(); ui.letter = ''; ui.family = null; drawGrid(); drawAlpha(); },
    });
    const itemGrid = h('div.item-grid');
    const alphaBar = h('div.alpha-bar');
    const crumb = h('div.crumb');

    function drawAlpha() {
      clear(alphaBar);
      alphaBar.append(h('button', {
        class: ui.letter === '' ? 'active' : '',
        onclick: () => { ui.letter = ''; ui.family = null; drawAlpha(); drawGrid(); },
      }, '⌂'));
      for (const letter of ARABIC_LETTERS) {
        const has = ui.activeLetters.has(letter)
          || (letter === 'أ' && [...ui.activeLetters].some((l) => 'اآإأ'.includes(l)));
        alphaBar.append(h('button', {
          class: `${ui.letter === letter ? 'active' : ''} ${has ? '' : 'off'}`.trim(),
          onclick: () => {
            ui.letter = ui.letter === letter ? '' : letter;
            ui.search = ''; searchInput.value = ''; ui.family = null;
            drawAlpha(); drawGrid();
          },
        }, letter));
      }
    }

    /** الأصناف بعد البحث/الحرف */
    function filtered() {
      let list = ui.items;
      if (ui.search) {
        const t = normalizeAr(ui.search);
        list = list.filter((i) => normalizeAr(i.name).includes(t)
          || normalizeAr(i.base || '').includes(t));
      }
      if (ui.letter) {
        const variants = ui.letter === 'أ' ? ['أ', 'ا', 'إ', 'آ'] : [ui.letter];
        list = list.filter((i) => variants.includes((i.base || i.name).trim()[0]));
      }
      return list;
    }

    function drawGrid() {
      clear(itemGrid); clear(crumb);
      const list = filtered();

      if (!list.length) {
        itemGrid.append(h('div', { style: 'grid-column:1/-1' }, h('div.empty', {}, 'ما في أصناف مطابقة')));
        return;
      }

      // البحث بيعرض الأصناف مباشرة - المستخدم عارف شو بده
      if (ui.search) { drawItems(list); return; }

      // عائلة مختارة => أحجامها
      if (ui.family) {
        const sizes = list.filter((i) => (i.base || i.name) === ui.family);
        crumb.append(
          h('button.btn.ghost.sm', { onclick: () => { ui.family = null; drawGrid(); } }, '→ كل الأصناف'),
          h('b', {}, ui.family));
        drawItems(sizes);
        return;
      }

      // الافتراضي: عائلات المنتجات (٩٣ عائلة بدل ٢٣٣ صنف)
      const families = new Map();
      for (const i of list) {
        const key = i.base || i.name;
        if (!families.has(key)) families.set(key, []);
        families.get(key).push(i);
      }
      for (const [name, members] of families) {
        if (members.length === 1) { drawItems(members, itemGrid); continue; }
        itemGrid.append(h('div.item-tile.family', {
          onclick: () => { ui.family = name; drawGrid(); },
        },
          h('span', {}, name),
          h('small', {}, `${members.length} أحجام`)));
      }
    }

    function drawItems(list, target = itemGrid) {
      for (const item of list) {
        const inBasket = basketQtyOf(item);
        target.append(h('div.item-tile', {
          class: inBasket ? 'picked' : '',
          onclick: () => openQuantity(item, drawGrid),
        },
          inBasket ? h('span.tile-badge', {}, String(inBasket)) : null,
          h('span', {}, item.size ? `${trimNum(item.size)}${item.size_unit || ''}` : item.name),
          h('small', {}, item.size ? item.name : (item.unit === 'kg' ? 'بالوزن' : 'بالعدد')),
          item.needs_price ? h('small', { style: 'color:var(--warn)' }, 'بدون سعر') : null));
      }
    }

    const heading = ui.party.type === 'warehouse'
      ? 'توريد للمستودع — ضيف الأصناف للسند'
      : `${DIRECTION_LABELS[ui.party.type][ui.direction]} — ضيف الأصناف للسند`;
    picker.append(h('div.step', {},
      h('div.step-head', {}, h('span.step-no', {}, ui.party.type === 'warehouse' ? '٢' : '٣'),
        h('b', {}, heading)),
      h('div.cashier-bar', {}, searchInput,
        h('button.btn.gold', { onclick: openNewItem }, 'صنف جديد')),
      crumb,
      h('div.cashier', {}, alphaBar, h('div.cashier-main', {}, itemGrid))));

    drawAlpha();
    drawGrid();
    requestAnimationFrame(() => picker.scrollIntoView({ behavior: 'smooth', block: 'nearest' }));
  }

  // ================= إضافة صنف للسند =================
  function openQuantity(item, after = () => {}) {
    const input = quantityInput(item);
    const note = h('input', { type: 'text', id: 'qty-note', placeholder: 'ملاحظة على السطر (اختياري)' });
    const already = basketQtyOf(item);

    return modal({
      title: `${ui.party.name} — ${item.name}`,
      confirmText: 'ضيف للسند',
      body: h('div', {},
        // ملخّص واضح قبل الإضافة: مين، شو الاتجاه، وأي صنف
        h('div.confirm-bar', {},
          h('span.pill', { class: ui.direction === 'out' ? 'out' : 'in' },
            voucherTitle(ui.party, ui.direction)),
          h('span.muted', {}, '·'),
          h('b', {}, item.name),
          ui.basket.length ? h('span.muted', {}, `· بالسند ${countItems(ui.basket.length)}`) : null),
        already ? h('div.alert.warn', {}, `هذا الصنف موجود بالسند (${already === 1 ? 'سطر واحد' : already + ' أسطر'}) - إذا ضفته بيصير سطر زيادة.`) : null,
        input.el,
        h('label.field', { style: 'margin-top:14px' }, 'ملاحظة', note)),
      onConfirm: () => {
        const value = input.get();
        if (!value) throw new Error('أدخل الكمية');
        addLine(item, value, note.value.trim());
        toast(`انضاف للسند: ${item.name} (${value})`);
        after();
      },
    });
  }

  // ================= صنف جديد =================
  function openNewItem() {
    const name = h('input', { type: 'text', id: 'new-item-name', placeholder: 'اسم الصنف' });
    const unit = h('select', { id: 'new-item-unit' },
      h('option', { value: 'piece' }, 'بالعدد'),
      h('option', { value: 'kg' }, 'بالوزن (كيلو/غرام)'));

    return modal({
      title: 'إضافة صنف جديد',
      confirmText: 'إضافة',
      body: h('div.grid', {},
        h('label.field', {}, 'اسم الصنف', name),
        h('label.field', {}, 'وحدة القياس', unit),
        h('div.alert.warn', {}, 'السعر بيحدده قصي من صفحته — الصنف بينضاف بدون سعر.')),
      onConfirm: async () => {
        if (!name.value.trim()) throw new Error('اكتب اسم الصنف');
        await api.post('/api/items', { name: name.value.trim(), unit: unit.value });
        toast('انضاف الصنف');
        await loadItems();
      },
    });
  }

  // ================= سند مثبّت: جرد، تعديل سطر، حذف =================
  async function openVoucher(summary) {
    const { voucher, lines } = await api.get(`/api/vouchers/${summary.id}`);
    const listBox = h('div.review-lines');

    function drawLines(rows) {
      clear(listBox);
      if (!rows.length) { listBox.append(h('div.empty', {}, 'ما ضل ولا سطر بالسند')); return; }
      rows.forEach((line, index) => {
        listBox.append(h('div.review-line', {},
          h('span.review-no', {}, String(index + 1)),
          h('span.review-item', {},
            h('b', {}, line.item_name),
            line.note ? h('small', {}, line.note) : null),
          h('span.review-qty', {}, qty(line.quantity, line.item_unit)),
          h('button.btn.ghost.sm', {
            onclick: () => editSavedLine(line, async () => {
              const fresh = await api.get(`/api/vouchers/${summary.id}`);
              drawLines(fresh.lines);
              loadRecent();
            }),
          }, 'تعديل'),
          h('button.btn.danger.sm', {
            onclick: async () => {
              await api.del(`/api/transactions/${line.id}`);
              toast('انشال السطر من السند');
              const fresh = await api.get(`/api/vouchers/${summary.id}`);
              drawLines(fresh.lines);
              loadRecent();
            },
          }, 'شيل')));
      });
    }
    drawLines(lines);

    return modal({
      title: `سند #${voucher.voucher_no}`,
      confirmText: 'تمام',
      cancelText: 'إغلاق',
      wide: true,
      body: h('div', {},
        h('div.confirm-bar', {},
          h('span.pill', {}, voucher.kind_label),
          h('b', {}, voucher.entity_name || 'المستودع'),
          h('span.muted', {}, '·'),
          h('span', {}, dateTime(voucher.occurred_at))),
        voucher.note ? h('div.muted', { style: 'margin-bottom:10px' }, voucher.note) : null,
        listBox),
    });
  }

  /** تعديل كمية سطر مثبّت (الحركة نفسها) */
  function editSavedLine(line, after) {
    const input = quantityInput({ unit: line.item_unit }, line.quantity_input || '');
    const note = h('input', { type: 'text', id: 'edit-note', value: line.note || '' });
    return modal({
      title: `تعديل: ${line.item_name}`,
      confirmText: 'حفظ التعديل',
      body: h('div.grid', {},
        h('div.muted', {}, `الكمية الحالية: ${line.quantity_input || line.quantity}`),
        input.el,
        h('label.field', { style: 'margin-top:14px' }, 'ملاحظة', note)),
      onConfirm: async () => {
        const value = input.get();
        if (!value) throw new Error('أدخل الكمية الجديدة');
        const result = await api.patch(`/api/transactions/${line.id}`, {
          quantity: value, note: note.value.trim(),
        });
        showWarnings(result.warnings);
        toast('تم التعديل');
        await after();
      },
    });
  }

  async function deleteVoucher(v) {
    const ok = await modal({
      title: `حذف سند #${v.voucher_no}`,
      confirmText: 'حذف السند كله',
      body: h('div', {},
        h('div.confirm-bar', {},
          h('span.pill', {}, v.kind_label),
          h('b', {}, v.entity_name || 'المستودع'),
          h('span.muted', {}, '·'),
          h('b', {}, countItems(v.line_count))),
        h('div.alert.warn', {}, 'بينحذف السند وكل أسطره مع بعض، وبينسجّل بسجل التدقيق. الأرصدة بترجع تلقائياً.')),
    });
    if (!ok) return;
    await api.del(`/api/vouchers/${v.id}`);
    toast(`انحذف سند #${v.voucher_no}`);
    loadRecent();
  }

  /** تنبيه كبير وواضح لما الكمية أكتر من المتوفر */
  let warningTimer = null;
  function showWarnings(warnings) {
    clearTimeout(warningTimer);
    clear(banner);
    if (!warnings?.length) return;
    for (const w of warnings) {
      banner.append(h('div.alert.danger.big', {}, h('span', {}, '⚠'), h('span', {}, w.message)));
    }
    warningTimer = setTimeout(() => clear(banner), 15000);
  }

  drawBasket();   // بيصفّي أثر أي سند من زيارة سابقة للصفحة
  await Promise.all([loadEntities(), loadItems(), loadRecent()]);
}

/** صفحة الزبون - كشف حسابه هو بس + إرسال ملاحظة/طلب */
const CUSTOMER_NAV = [
  { key: 'statement', label: 'كشف حسابي', title: 'كشف حسابي', icon: 'statement', render: renderMyStatement },
  { key: 'requests', label: 'طلباتي', title: 'ملاحظة أو طلب', icon: 'message', render: renderMyRequests },
];

function renderMyStatement(root) {
  clear(root);
  const statementBox = h('div');
  let params = { week: 0 };
  const picker = periodPicker((p) => { params = p; loadStatement(); });
  root.append(picker, statementBox);

  async function loadStatement() {
    const data = await api.get(`/api/statements/${state.user.entity_id}`, params);
    clear(statementBox);
    statementBox.append(statementCard(data));
  }
  loadStatement();
}

function renderMyRequests(root) {
  clear(root);
  root.append(requestsCard());
}

function requestsCard() {
  const input = h('textarea', { rows: 3, placeholder: 'اكتب ملاحظتك أو طلبك لقصي…' });
  const listBox = h('div');

  const card = h('div', {},
    h('div.card.no-print', {},
    h('h3', {}, 'اكتب ملاحظة أو طلب'),
    h('div.grid', {},
      input,
      h('div.row', {}, h('button.btn', {
        onclick: async () => {
          const body = input.value.trim();
          if (!body) return toast('اكتب الملاحظة أول شي', true);
          await api.post('/api/requests', { body });
          input.value = '';
          toast('انبعت طلبك');
          loadRequests();
        },
      }, 'إرسال')))),
    h('div.card', {}, h('h3', {}, 'طلباتي السابقة'), listBox));

  async function loadRequests() {
    const { requests } = await api.get('/api/requests');
    clear(listBox);
    listBox.append(table([
      { label: 'الطلب', key: 'body' },
      { label: 'التاريخ', render: (r) => dateTime(r.created_at) },
      { label: 'الحالة', render: (r) => (r.handled ? h('span.pill.in', {}, 'تمّ') : h('span.pill.warn', {}, 'قيد المتابعة')) },
    ], requests, { empty: 'ما بعتت طلبات بعد' }));
  }
  loadRequests();
  return card;
}

};
const NAV_BY_ROLE = {
  admin: ADMIN_NAV, recorder: RECORDER_NAV,
  viewer: OVERVIEW_NAV, customer: CUSTOMER_NAV,
};

/** شعار المفلح - رابط واحد ثابت والسيرفر بيختار الملف (png أو svg) */
const logo = (className = 'logo') => h('img', { class: className, src: state.logo, alt: 'المفلح' });

const initials = (name) => String(name || '').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('');

async function boot() {
  try {
    const config = await api.get('/api/config');
    state.currency = config.currency || 'د.أ';
    state.user = config.user;
  } catch {
    state.user = null;
  }
  if (!state.user) return renderLogin(app, boot);
  renderShell();
}

function renderShell() {
  const user = state.user;
  const nav = NAV_BY_ROLE[user.role] || OVERVIEW_NAV;
  let active = nav[0].key;
  clear(app);

  // شاشة وحدة (عبود) ما بتستاهل سايدبار - العرض كله للشغل
  const singleSection = nav.length === 1;

  // ---------- السايدبار ----------
  const navBox = h('div.nav');
  const brand = h('div.brand', {}, logo(),
    h('div.brand-text', {}, h('b', {}, 'مستودعات المفلح'), h('span', {}, 'إدارة المخزون')));
  const sidebar = singleSection ? null : h('aside.sidebar', {},
    brand,
    navBox,
    h('div.spacer'),
    h('div.sidebar-foot', {},
      h('button', { onclick: openAccountDialog }, icon('settings'), 'حسابي'),
      h('button', {
        onclick: async () => { await api.logout(); location.reload(); },
      }, icon('logout'), 'خروج')));

  // ---------- الشريط العلوي ----------
  const bellCount = h('span.bell-dot', { style: 'display:none' });
  const bell = h('button.icon-btn', { title: 'التنبيهات', onclick: () => toggleNotifications(bell) },
    icon('bell'), bellCount);

  const searchBox = buildSearch((key) => go(key));

  const topbar = h('header.topbar', {},
    singleSection ? brand : null,
    (user.role === 'admin' || user.role === 'viewer') ? searchBox : h('div.spacer'),
    h('div.spacer'),
    user.notifications_on ? bell : null,
    singleSection ? h('button.icon-btn', { title: 'حسابي', onclick: openAccountDialog }, icon('settings')) : null,
    singleSection ? h('button.icon-btn', {
      title: 'خروج', onclick: async () => { await api.logout(); location.reload(); },
    }, icon('logout')) : null,
    h('div.account', {},
      h('div.avatar', {}, initials(user.display_name)),
      h('div.who', {}, h('b', {}, user.display_name), h('span', {}, ROLE_LABELS[user.role]))));

  // ---------- المحتوى ----------
  const title = h('h1');
  const actions = h('div.row');
  const section = h('div');
  const panel = h('div.panel', {},
    h('div.page-head', {}, title, h('div.spacer'), actions), section);

  app.append(h('div.shell', {}, sidebar,
    h('div.main', {}, topbar, h('div.content', {}, panel))));

  function drawNav() {
    if (singleSection) return;
    clear(navBox);
    for (const item of nav) {
      navBox.append(h('button', {
        class: active === item.key ? 'active' : '',
        onclick: () => go(item.key),
      }, icon(item.icon), item.label));
    }
  }

  function go(key) {
    const item = nav.find((n) => n.key === key);
    if (!item) return;
    active = key;
    drawNav();
    title.textContent = item.title || item.label;
    clear(actions);
    clear(section);
    section.append(h('div.empty', {}, 'جاري التحميل…'));
    Promise.resolve(item.render(section, { actions, go }))
      .then(() => { if (section.firstChild?.classList?.contains('empty') && section.children.length > 1) section.firstChild.remove(); })
      .catch((err) => { clear(section); section.append(h('div.alert.danger', {}, err.message)); });
  }

  go(active);

  if (user.notifications_on) {
    refreshBell(bellCount);
    setInterval(() => refreshBell(bellCount), 60000);
  }
}

/** بحث سريع: زبون => كشفه، صنف => صفحة الأصناف */
function buildSearch(go) {
  const input = h('input', { type: 'search', placeholder: 'دوّر على زبون أو صنف…', id: 'global-search' });
  const results = h('div.notif-panel', { style: 'display:none;top:60px' });
  let cache = null;

  const close = () => { results.style.display = 'none'; };
  const open = async () => {
    const term = input.value.trim();
    if (!term) return close();
    if (!cache) {
      const [items, entities] = await Promise.all([
        api.get('/api/items').catch(() => ({ items: [] })),
        api.get('/api/users/entities').catch(() => ({ entities: [] })),
      ]);
      cache = { items: items.items || [], entities: entities.entities || [] };
    }
    clear(results);
    const customers = cache.entities.filter((e) => e.type === 'customer' && e.name.includes(term));
    const items = cache.items.filter((i) => i.name.includes(term)).slice(0, 6);
    if (!customers.length && !items.length) {
      results.append(h('div.empty', {}, 'ما في نتائج'));
    }
    for (const c of customers) {
      results.append(h('div.notif', {
        style: 'cursor:pointer',
        onclick: () => { close(); input.value = ''; go('statements'); },
      }, h('b', {}, c.name), h('p', {}, 'كشف حساب الزبون')));
    }
    for (const i of items) {
      results.append(h('div.notif', {
        style: 'cursor:pointer',
        onclick: () => { close(); input.value = ''; go('items'); },
      }, h('b', {}, i.name), h('p', {}, 'صنف — الأصناف والأسعار')));
    }
    results.style.display = 'block';
  };

  input.addEventListener('input', open);
  input.addEventListener('blur', () => setTimeout(close, 180));
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); input.focus(); }
  });

  return h('div.search', {}, icon('search', 16), input, results);
}

async function refreshBell(dot) {
  try {
    const { unread } = await api.get('/api/notifications/count');
    dot.textContent = unread > 99 ? '99+' : String(unread);
    dot.style.display = unread > 0 ? 'grid' : 'none';
  } catch { /* تجاهل */ }
}

let notifPanel = null;
async function toggleNotifications(anchor) {
  if (notifPanel) { notifPanel.remove(); notifPanel = null; return; }
  const { notifications, unread } = await api.get('/api/notifications', { limit: 40 });
  const list = h('div');

  notifPanel = h('div.notif-panel', {},
    h('header', {},
      h('b', {}, `التنبيهات${unread ? ` (${unread})` : ''}`),
      h('div', { style: 'flex:1' }),
      unread ? h('button.btn.ghost.sm', {
        onclick: async () => {
          await api.post('/api/notifications/read-all');
          notifPanel.remove(); notifPanel = null;
          toast('تم تعليم الكل كمقروء');
          const dot = document.querySelector('.bell-dot');
          if (dot) dot.style.display = 'none';
        },
      }, 'تعليم الكل كمقروء') : null),
    list);

  if (!notifications.length) list.append(h('div.empty', {}, 'ما في تنبيهات'));
  for (const n of notifications) {
    list.append(h('div.notif', {
      class: n.read_at ? '' : 'unread',
      onclick: async () => { if (!n.read_at) await api.post(`/api/notifications/${n.id}/read`); },
    }, h('b', {}, n.title), n.body ? h('p', {}, n.body) : null, h('time', {}, dateTime(n.created_at))));
  }

  document.body.append(notifPanel);
  setTimeout(() => {
    const onDoc = (e) => {
      if (notifPanel && !notifPanel.contains(e.target) && !anchor.contains(e.target)) {
        notifPanel.remove(); notifPanel = null;
        document.removeEventListener('click', onDoc);
      }
    };
    document.addEventListener('click', onDoc);
  }, 10);
}

/** تغيير اليوزر/الباسورد - متاح لكل الحسابات */
function openAccountDialog() {
  const current = h('input', { type: 'password', id: 'cur-pass', placeholder: 'كلمة السر الحالية' });
  const username = h('input', { type: 'text', id: 'new-user', value: state.user.username });
  const password = h('input', { type: 'password', id: 'new-pass', placeholder: 'اتركها فاضية إذا ما بدك تغيّرها' });

  return modal({
    title: 'بيانات الدخول تبعي',
    confirmText: 'حفظ',
    body: h('div.grid', {},
      h('label.field', {}, 'كلمة السر الحالية', current),
      h('label.field', {}, 'اسم المستخدم', username),
      h('label.field', {}, 'كلمة سر جديدة', password),
      h('div.alert.warn', {}, 'تغيير كلمة السر بينهي جلساتك المفتوحة على أي جهاز تاني.')),
    onConfirm: async () => {
      const payload = { current_password: current.value };
      if (username.value.trim() && username.value.trim() !== state.user.username) {
        payload.new_username = username.value.trim();
      }
      if (password.value) payload.new_password = password.value;
      if (!payload.new_username && !payload.new_password) throw new Error('ما في شي للتعديل');
      await api.post('/api/auth/change-credentials', payload);
      toast('تم تحديث بيانات الدخول');
      setTimeout(() => location.reload(), 800);
    },
  });
}

boot();


// ===== دخول سريع للتجربة =====
document.querySelectorAll('.demo-bar code').forEach((chip) => {
  chip.addEventListener('click', async () => {
    const username = chip.dataset.user;
    const password = chip.dataset.pass;
    const userField = document.querySelector('input[name=username]');
    if (userField) {
      // على شاشة الدخول: بنعبّي الخانات ونضغط دخول
      userField.value = username;
      document.querySelector('input[name=password]').value = password;
      document.querySelector('form button[type=submit]').click();
    } else {
      // داخل النظام: بنطلع وبندخل بالحساب الجديد
      await api.logout();
      await api.login(username, password);
      location.reload();
    }
  });
});
  </script>
