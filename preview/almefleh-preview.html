<title>مستودعات المفلح</title>
  <style>
/* ===== نظام مستودعات المفلح - هوية بصرية: أخضر غامق + ذهبي ===== */
:root {
  --green-900: #08291D;
  --green-800: #0B3D2C;
  --green-700: #124A34;
  --green-600: #1B5E3F;
  --gold-400:  #E7C868;
  --gold-500:  #C9A227;
  --gold-600:  #9C7A12;
  --cream:     #F7F4EA;
  --paper:     #FFFFFF;
  --ink:       #1A1A17;
  --muted:     #6B6B62;
  --line:      #E2DDCD;
  --danger:    #B3261E;
  --danger-bg: #FDECEA;
  --ok:        #1E7A4B;
  --warn:      #9A6A00;
  --warn-bg:   #FFF6DF;
  --radius:    12px;
  --shadow:    0 1px 2px rgba(8,41,29,.06), 0 8px 24px rgba(8,41,29,.07);
  --font: "Segoe UI", "Noto Naskh Arabic", "Dubai", Tahoma, system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--cream);
  color: var(--ink);
  direction: rtl;
  font-size: 15px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--green-700); }

/* ===== الهيدر ===== */
.topbar {
  background: linear-gradient(180deg, var(--green-700), var(--green-800));
  color: #fff;
  display: flex; align-items: center; gap: 14px;
  padding: 10px 16px;
  position: sticky; top: 0; z-index: 40;
  border-bottom: 3px solid var(--gold-500);
  box-shadow: 0 2px 12px rgba(8,41,29,.18);
}
.topbar .logo { height: 42px; width: auto; display: block; }
.topbar .brand { display: flex; flex-direction: column; line-height: 1.2; }
.topbar .brand b { font-size: 16px; letter-spacing: .3px; }
.topbar .brand small { color: var(--gold-400); font-size: 12px; }
.topbar .spacer { flex: 1; }
.topbar .who { font-size: 13px; text-align: left; }
.topbar .who b { display: block; }
.topbar .who span { color: var(--gold-400); font-size: 12px; }

.icon-btn {
  background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.18);
  color: #fff; border-radius: 10px; padding: 8px 11px; cursor: pointer;
  position: relative; display: inline-flex; align-items: center; gap: 6px;
}
.icon-btn:hover { background: rgba(255,255,255,.18); }
.bell-dot {
  position: absolute; top: -5px; inset-inline-start: -5px;
  background: var(--gold-500); color: var(--green-900);
  border-radius: 999px; min-width: 19px; height: 19px; padding: 0 5px;
  font-size: 11px; font-weight: 700; display: grid; place-items: center;
}

/* ===== التبويبات ===== */
.tabs {
  display: flex; gap: 4px; overflow-x: auto; padding: 8px 12px 0;
  background: var(--paper); border-bottom: 1px solid var(--line);
  position: sticky; top: 65px; z-index: 30;
}
.tabs button {
  background: none; border: none; border-bottom: 3px solid transparent;
  padding: 9px 14px; cursor: pointer; color: var(--muted); white-space: nowrap;
  border-radius: 8px 8px 0 0; font-weight: 600;
}
.tabs button:hover { background: var(--cream); }
.tabs button.active { color: var(--green-800); border-bottom-color: var(--gold-500); }

/* ===== التخطيط ===== */
.page { padding: 16px; max-width: 1280px; margin: 0 auto; }
.card {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.card > h3 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.card > h3 .sub { font-weight: 400; color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.grid { display: grid; gap: 12px; }
.grid.cols-4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }

/* ===== بطاقات الأرقام ===== */
.stat {
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; border-top: 3px solid var(--gold-500);
}
.stat .label { color: var(--muted); font-size: 13px; }
.stat .value { font-size: 26px; font-weight: 700; color: var(--green-800); margin-top: 2px; }
.stat.danger { border-top-color: var(--danger); }
.stat.danger .value { color: var(--danger); }

/* ===== الحقول ===== */
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
input, select, textarea {
  background: var(--paper); border: 1px solid var(--line); border-radius: 9px;
  padding: 9px 11px; min-width: 0; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--green-600); box-shadow: 0 0 0 3px rgba(27,94,63,.12); }
input[type="number"] { text-align: right; }

.btn {
  background: var(--green-700); color: #fff; border: none; border-radius: 9px;
  padding: 10px 16px; cursor: pointer; font-weight: 600;
}
.btn:hover { background: var(--green-600); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--green-800); border: 1px solid var(--line); }
.btn.ghost:hover { background: var(--cream); }
.btn.gold { background: var(--gold-500); color: var(--green-900); border-color: var(--gold-500); }
.btn.gold:hover { background: var(--gold-400); }
.btn.danger { background: var(--danger); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 7px; }

/* ===== الجداول ===== */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 13px; background: var(--cream); position: sticky; top: 0; }
tbody tr:hover { background: #FBFAF5; }
td.num, th.num { font-variant-numeric: tabular-nums; }
tr.neg td { background: var(--danger-bg); }
tfoot td { font-weight: 700; background: var(--cream); }

.pill {
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 600; background: var(--cream); border: 1px solid var(--line);
}
.pill.out { background: var(--danger-bg); color: var(--danger); border-color: #F3C9C5; }
.pill.in  { background: #E8F5EE; color: var(--ok); border-color: #BEE3CE; }
.pill.pay { background: var(--warn-bg); color: var(--warn); border-color: #F0DFB0; }
.pill.warn{ background: var(--warn-bg); color: var(--warn); border-color: #F0DFB0; }

.muted { color: var(--muted); }
.mono { font-variant-numeric: tabular-nums; }
.right { text-align: left; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; }

/* ===== التنبيهات ===== */
.alert { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; border: 1px solid; }
.alert.danger { background: var(--danger-bg); border-color: #F3C9C5; color: var(--danger); font-weight: 600; }
.alert.warn { background: var(--warn-bg); border-color: #F0DFB0; color: var(--warn); }
.alert.ok { background: #E8F5EE; border-color: #BEE3CE; color: var(--ok); }
.alert.big { font-size: 17px; padding: 16px; display: flex; gap: 10px; align-items: center; }

#toasts { position: fixed; bottom: 18px; inset-inline-start: 18px; z-index: 90; display: grid; gap: 8px; }
.toast {
  background: var(--green-800); color: #fff; padding: 11px 15px; border-radius: 10px;
  box-shadow: var(--shadow); max-width: 380px; animation: pop .18s ease-out;
  border-inline-start: 4px solid var(--gold-500);
}
.toast.err { background: var(--danger); border-inline-start-color: #7A1712; }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } }

/* ===== النوافذ ===== */
.modal-bg {
  position: fixed; inset: 0; background: rgba(8,41,29,.45); z-index: 80;
  display: grid; place-items: center; padding: 16px;
}
.modal {
  background: var(--paper); border-radius: 16px; padding: 20px; width: min(560px, 100%);
  max-height: 90vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.modal h3 { margin: 0 0 14px; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-start; margin-top: 18px; }

/* ===== قائمة التنبيهات ===== */
.notif-panel {
  position: fixed; top: 64px; inset-inline-start: 12px; width: min(400px, calc(100vw - 24px));
  background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 18px 50px rgba(0,0,0,.22); z-index: 70; max-height: 70vh; overflow: auto;
}
.notif-panel header { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
.notif { padding: 11px 14px; border-bottom: 1px solid var(--line); }
.notif.unread { background: #FBF8EC; border-inline-start: 3px solid var(--gold-500); }
.notif b { display: block; font-size: 14px; }
.notif p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.notif time { font-size: 11px; color: var(--muted); }

/* ===== شاشة الكاشير (آيباد) ===== */
.cashier { display: grid; grid-template-columns: 1fr 56px; gap: 10px; height: calc(100vh - 68px); padding: 10px; }
.cashier-main { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.cashier-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.cashier-bar input[type="search"] { flex: 1; min-width: 180px; font-size: 17px; padding: 12px 14px; }
.entity-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.entity-tabs button {
  border: 2px solid var(--line); background: var(--paper); border-radius: 12px;
  padding: 10px 16px; cursor: pointer; font-weight: 700; font-size: 15px;
}
.entity-tabs button.active { border-color: var(--gold-500); background: var(--green-700); color: #fff; }
.kind-tabs button.active { border-color: var(--gold-500); background: var(--gold-500); color: var(--green-900); }

.item-grid {
  flex: 1; overflow-y: auto; display: grid; gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); align-content: start;
  padding: 4px; min-height: 0;
}
.item-tile {
  background: var(--paper); border: 2px solid var(--line); border-radius: 14px;
  padding: 14px 10px; text-align: center; cursor: pointer; font-weight: 700; font-size: 16px;
  min-height: 86px; display: flex; flex-direction: column; justify-content: center; gap: 4px;
  -webkit-tap-highlight-color: transparent;
}
.item-tile:active { transform: scale(.97); }
.item-tile:hover { border-color: var(--gold-500); }
.item-tile small { font-weight: 500; color: var(--muted); font-size: 12px; }
.item-tile.add { border-style: dashed; color: var(--green-700); }

.alpha-bar {
  display: flex; flex-direction: column; gap: 2px; overflow-y: auto;
  background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 4px;
}
.alpha-bar button {
  border: none; background: none; cursor: pointer; padding: 5px 0; border-radius: 7px;
  font-size: 15px; font-weight: 700; color: var(--green-800); width: 100%;
}
.alpha-bar button:hover { background: var(--cream); }
.alpha-bar button.active { background: var(--green-700); color: #fff; }
.alpha-bar button.off { color: #C9C6BA; }

.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; direction: ltr; }
.keypad button {
  padding: 13px; font-size: 20px; font-weight: 700; border-radius: 12px;
  border: 1px solid var(--line); background: var(--paper); cursor: pointer;
}
.keypad button:active { background: var(--cream); }
.qty-display {
  font-size: 30px; font-weight: 700; text-align: center; padding: 12px; direction: ltr;
  background: var(--cream); border-radius: 12px; border: 2px solid var(--gold-500);
  min-height: 64px; font-variant-numeric: tabular-nums;
}

.recent { max-height: 190px; overflow-y: auto; }
.recent-row { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
.recent-row .grow { flex: 1; }

/* ===== شاشة الدخول ===== */
.login-wrap {
  min-height: 100vh; display: grid; place-items: center; padding: 20px;
  background: radial-gradient(circle at 50% 0%, var(--green-700), var(--green-900) 70%);
}
.login-card {
  background: var(--paper); border-radius: 20px; padding: 30px 26px; width: min(400px, 100%);
  box-shadow: 0 24px 70px rgba(0,0,0,.4); border-top: 5px solid var(--gold-500);
}
.login-card .logo { width: 220px; max-width: 100%; display: block; margin: 0 auto 18px; }
.login-card h1 { font-size: 19px; text-align: center; margin: 0 0 22px; color: var(--green-800); }
.login-card label.field { margin-bottom: 14px; }
.login-card .btn { width: 100%; padding: 13px; font-size: 16px; }

/* ===== الطباعة ===== */
@media print {
  .topbar, .tabs, .no-print, .btn, #toasts { display: none !important; }
  body { background: #fff; }
  .card { box-shadow: none; border: 1px solid #ccc; page-break-inside: avoid; }
  .page { padding: 0; max-width: none; }
}

@media (max-width: 720px) {
  .page { padding: 12px; }
  .topbar .brand small { display: none; }
  .cashier { grid-template-columns: 1fr 46px; height: auto; }
  .item-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
}

/* ===== شريط النسخة التجريبية ===== */
.demo-bar {
  position: fixed; bottom: 0; inset-inline: 0; z-index: 100;
  background: var(--green-900); color: #fff; padding: 8px 14px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  font-size: 13px; border-top: 2px solid var(--gold-500);
}
.demo-bar b { color: var(--gold-400); }
.demo-bar code {
  background: rgba(255,255,255,.12); padding: 2px 7px; border-radius: 6px;
  font-family: inherit; cursor: pointer; border: 1px solid rgba(255,255,255,.18);
}
.demo-bar code:hover { background: rgba(255,255,255,.25); }
.demo-bar .grow { flex: 1; }
.demo-bar button {
  background: var(--gold-500); color: var(--green-900); border: none;
  border-radius: 7px; padding: 5px 12px; cursor: pointer; font-weight: 700;
}
body { padding-bottom: 46px; }
@media (max-width: 720px) { .demo-bar { font-size: 12px; } }
</style>

/** إنشاء عنصر: h('div.card', {onclick}, ...children) - بتدعم #id و .class */
const SPEC_RE = /^([a-zA-Z][a-zA-Z0-9-]*)?(#[\w-]+)?((?:\.[\w-]+)*)$/;
function h(spec, props = {}, ...children) {
  const match = SPEC_RE.exec(String(spec));
  if (!match) throw new Error(`وصف عنصر غير صالح: ${spec}`);
  const [, tag, id, classPart] = match;
  const el = document.createElement(tag || 'div');
  if (id) el.id = id.slice(1);
  if (classPart) el.className = classPart.slice(1).split('.').join(' ');
  for (const [key, value] of Object.entries(props || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'class') el.className = `${el.className} ${value}`.trim();
    else if (key === 'html') el.innerHTML = value;
    else if (key.startsWith('on') && typeof value === 'function') el.addEventListener(key.slice(2), value);
    else if (key === 'dataset') Object.assign(el.dataset, value);
    else if (key in el && key !== 'list' && key !== 'type' && key !== 'size') el[key] = value;
    else el.setAttribute(key, value);
  }
  for (const child of children.flat(3)) {
    if (child === null || child === undefined || child === false) continue;
    el.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return el;
}

/** مبلغ مالي */
function money(value) {
  if (value === null || value === undefined || value === '') return '—';
  const n = Number(value);
  if (!Number.isFinite(n)) return '—';
  return `${ltr(n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }))} ${state.currency}`;
}

/** كمية حسب وحدة الصنف */
function qty(value, unit) {
  if (value === null || value === undefined) return '—';
  const n = Number(value);
  if (!Number.isFinite(n)) return '—';
  if (unit === 'kg') {
    if (n !== 0 && Math.abs(n) < 1) return `${ltr(Math.round(n * 1000))} غم`;
    return `${ltr(trim(n.toFixed(3)))} كغم`;
  }
  return ltr(trim(n.toFixed(3)));
}

const DOW = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const TZ = 'Asia/Amman';

function dateTime(value) {
  if (!value) return '—';
  const d = new Date(value);
  const parts = new Intl.DateTimeFormat('en-GB', {
    timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false, weekday: 'short',
  }).formatToParts(d).reduce((a, p) => (a[p.type] = p.value, a), {});
  const idx = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[parts.weekday];
  return `${DOW[idx]} ${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}`;
}

function dateOnly(value) {
  if (!value) return '—';
  return new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date(value));
}

// ===== تحويل التواريخ بتوقيت المستودع =====
// كل تاريخ بيدخله المستخدم بينقرأ بتوقيت المستودع (عمّان)، مش بتوقيت جهازه.
// بدون هاد، آيباد مضبوط على توقيت تاني بيزيح الحركة ساعات - وقرب منتصف
// الليل بتنتقل ليوم تاني، يعني أسبوع تاني بالكشف.

const pad2 = (n) => String(n).padStart(2, '0');

function ammanParts(date) {
  const p = new Intl.DateTimeFormat('en-CA', {
    timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
  }).formatToParts(date).reduce((a, x) => (a[x.type] = x.value, a), {});
  return {
    year: +p.year, month: +p.month, day: +p.day,
    hour: +p.hour % 24, minute: +p.minute, second: +p.second,
  };
}

function tzOffsetMs(date) {
  const p = ammanParts(date);
  return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second)
    - Math.floor(date.getTime() / 1000) * 1000;
}

/** وقت محلي بتوقيت المستودع => لحظة UTC */
function ammanToUtc(year, month, day, hour = 0, minute = 0) {
  const guess = Date.UTC(year, month - 1, day, hour, minute, 0);
  let offset = tzOffsetMs(new Date(guess));
  offset = tzOffsetMs(new Date(guess - offset)); // تصحيح لحواف التوقيت الصيفي
  return new Date(guess - offset);
}

/**
 * قيمة خانة تاريخ ("YYYY-MM-DD") أو تاريخ ووقت ("YYYY-MM-DDTHH:MM")
 * => ISO، مقروءة بتوقيت المستودع.
 */
function inputToIso(value) {
  const [datePart, timePart] = String(value || '').split('T');
  const [year, month, day] = String(datePart).split('-').map(Number);
  if (!year || !month || !day) throw new Error('تاريخ غير صالح');
  const [hour, minute] = String(timePart || '00:00').split(':').map(Number);
  return ammanToUtc(year, month, day, hour || 0, minute || 0).toISOString();
}

/** ISO => "YYYY-MM-DDTHH:MM" لخانة datetime-local بتوقيت المستودع */
function toDateTimeInput(iso) {
  const p = ammanParts(new Date(iso));
  return `${p.year}-${pad2(p.month)}-${pad2(p.day)}T${pad2(p.hour)}:${pad2(p.minute)}`;
}

/** "YYYY-MM-DD" لسبت بداية الأسبوع الحالي بتوقيت المستودع */
function weekStartString(date = new Date()) {
  const p = ammanParts(date);
  const dow = new Date(Date.UTC(p.year, p.month - 1, p.day)).getUTCDay(); // 6 = السبت
  const back = (dow - 6 + 7) % 7;
  const start = new Date(Date.UTC(p.year, p.month - 1, p.day - back));
  return `${start.getUTCFullYear()}-${pad2(start.getUTCMonth() + 1)}-${pad2(start.getUTCDate())}`;
}

function toast(message, isError = false) {
  const box = document.getElementById('toasts');
  const el = h('div.toast', { class: isError ? 'err' : '' }, message);
  box.append(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 3600);
  setTimeout(() => el.remove(), 4000);
}

/** نافذة منبثقة - بترجّع Promise بنتيجة الحفظ */
function modal({ title, body, confirmText = 'حفظ', cancelText = 'إلغاء', onConfirm, wide = false }) {
  return new Promise((resolve) => {
    const content = h('div.modal', { style: wide ? 'width:min(880px,100%)' : '' });
    const bg = h('div.modal-bg', {
      onclick: (e) => { if (e.target === bg) close(null); },
    }, content);

    const close = (value) => { bg.remove(); document.removeEventListener('keydown', onKey); resolve(value); };
    const onKey = (e) => { if (e.key === 'Escape') close(null); };
    document.addEventListener('keydown', onKey);

    const confirmBtn = h('button.btn', {
      onclick: async () => {
        if (!onConfirm) return close(true);
        confirmBtn.disabled = true;
        try { const result = await onConfirm(content); if (result !== false) close(result ?? true); }
        catch (err) { toast(err.message, true); }
        finally { confirmBtn.disabled = false; }
      },
    }, confirmText);

    content.append(
      h('h3', {}, title),
      body,
      h('div.actions', {},
        confirmBtn,
        h('button.btn.ghost', { onclick: () => close(null) }, cancelText)),
    );
    document.body.append(bg);
    setTimeout(() => content.querySelector('input,select,textarea')?.focus(), 40);
  });
}

function confirmDialog(message, confirmText = 'تأكيد') {
  return modal({ title: 'تأكيد', body: h('p', {}, message), confirmText });
}

/** جدول جاهز: columns = [{key, label, render, cls}] */
function table(columns, rows, { empty = 'ما في بيانات', footer = null, rowClass = null } = {}) {
  if (!rows.length) return h('div.empty', {}, empty);
  const thead = h('thead', {}, h('tr', {}, columns.map((c) => h('th', { class: c.cls || '' }, c.label))));
  const tbody = h('tbody', {}, rows.map((row) => h('tr', { class: rowClass ? rowClass(row) : '' },
    columns.map((c) => {
      const value = c.render ? c.render(row) : row[c.key];
      return h('td', { class: c.cls || '' }, value instanceof Node ? value : (value ?? '—'));
    }))));
  const parts = [thead, tbody];
  if (footer) parts.push(h('tfoot', {}, footer));
  return h('div.table-wrap', {}, h('table', {}, parts));
}

/** تصدير جدول كملف CSV (بيفتح بإكسل عربي صح) */
function downloadCsv(filename, headerRow, rows) {
  const escape = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = [headerRow, ...rows].map((r) => r.map(escape).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: filename });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const thisWeek = (hoursAfterStart) => {
  const start = weekRange(0).from.getTime();
  return new Date(Math.min(start + hoursAfterStart * 3600000, Date.now() - 60000)).toISOString();
};

const TZ_api = 'Asia/Amman';
const parts = (d) => {
  const p = new Intl.DateTimeFormat('en-CA', {
    timeZone: TZ_api, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
  }).formatToParts(new Date(d)).reduce((a, x) => (a[x.type] = x.value, a), {});
  return { year: +p.year, month: +p.month, day: +p.day, hour: +p.hour % 24, minute: +p.minute, second: +p.second };
};
const offsetMs = (d) => {
  const p = parts(d);
  return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - Math.floor(new Date(d).getTime() / 1000) * 1000;
};
function zonedToUtc(y, m, d, h = 0, mi = 0) {
  const guess = Date.UTC(y, m - 1, d, h, mi, 0);
  let off = offsetMs(new Date(guess));
  off = offsetMs(new Date(guess - off));
  return new Date(guess - off);
}
const dateStr = (d) => { const p = parts(d); return `${p.year}-${String(p.month).padStart(2, '0')}-${String(p.day).padStart(2, '0')}`; };

/** الأسبوع بيبلّش السبت بتوقيت عمّان */
function weekRange(offset = 0) {
  const p = parts(new Date());
  const dow = new Date(Date.UTC(p.year, p.month - 1, p.day)).getUTCDay();
  const back = (dow - 6 + 7) % 7;
  const from = zonedToUtc(p.year, p.month, p.day - back + offset * 7);
  const to = zonedToUtc(p.year, p.month, p.day - back + offset * 7 + 7);
  return { from, to };
}
function resolvePeriod(q = {}) {
  if (q.from && q.to) {
    const [fy, fm, fd] = q.from.split('-').map(Number);
    const [ty, tm, td] = q.to.split('-').map(Number);
    return { from: zonedToUtc(fy, fm, fd), to: zonedToUtc(ty, tm, td + 1), label: `من ${q.from} إلى ${q.to}`, type: 'custom' };
  }
  const offset = Number(q.week || 0);
  const r = weekRange(offset);
  return { ...r, label: `أسبوع ${dateStr(r.from)} → ${dateStr(new Date(r.to.getTime() - 1))}`, type: 'week', offset };
}

function view(t) {
  const item = t.item_id ? itemById(t.item_id) : null;
  const entity = t.entity_id ? entityById(t.entity_id) : null;
  const basePrice = t.item_id ? priceAt(t.item_id, t.occurred_at) : null;
  const unit_price = t.unit_price_override != null ? t.unit_price_override : basePrice;
  const priced = ['customer_out', 'customer_return'].includes(t.kind);
  const amount = t.kind === 'payment'
    ? t.payment_amount
    : (priced && unit_price != null ? round2(t.quantity * unit_price) : null);

  const stock_delta = { supply: t.quantity, customer_out: -t.quantity, customer_return: t.quantity,
    operator_out: -t.quantity, operator_in: t.quantity, payment: 0 }[t.kind] || 0;
  const debt_delta = t.kind === 'customer_out' ? (amount || 0)
    : t.kind === 'customer_return' ? -(amount || 0)
    : t.kind === 'payment' ? -t.payment_amount : 0;

  return {
    ...t,
    entity_name: entity ? entity.name : null,
    entity_type: entity ? entity.type : null,
    item_name: item ? item.name : null,
    item_unit: item ? item.unit : null,
    unit_price,
    price_overridden: t.unit_price_override != null,
    amount,
    price_pending: priced && unit_price == null,
    stock_delta,
    debt_delta,
    kind_label: KIND_LABELS[t.kind],
  };
}

const liveTxns = () => db.transactions.filter((t) => !t.deleted_at);
const stockOf = (itemId) => round3(liveTxns().filter((t) => t.item_id === itemId)

const balanceOf = (entityId) => round2(liveTxns().filter((t) => t.entity_id === entityId)
  .reduce((s, t) => s + view(t).debt_delta, 0));

// ---------- تحليل الكميات (نفس قواعد النظام) ----------
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
function normalizeDigits(input) {
  let out = '';
  for (const ch of String(input)) {
    const i = AR_DIGITS.indexOf(ch);
    if (i >= 0) { out += String(i); continue; }
    if (ch === '٫' || ch === '،' || ch === ',') { out += '.'; continue; }
    if (ch === '٬' || ch === '_') continue;
    out += ch;
  }
  return out;
}
const KG = ['كيلوغرام', 'كيلو', 'كغم', 'كجم', 'كغ', 'كج', 'ك', 'kg', 'k'];
const G = ['غرام', 'جرام', 'غم', 'جم', 'غ', 'ج', 'gm', 'gr', 'g'];
function parseQuantity(input, unit = 'piece') {
  const raw = String(input ?? '').trim();
  if (!raw) throw new Error('الكمية مطلوبة');
  const text = normalizeDigits(raw).replace(/\s+/g, '').toLowerCase();
  if (!/[0-9]/.test(text)) throw new Error(`كمية غير مفهومة: "${raw}"`);
  const segs = [];
  let i = 0;
  while (i < text.length) {
    const m = /^[0-9]+(?:\.[0-9]+)?/.exec(text.slice(i));
    if (!m) throw new Error(`كمية غير مفهومة: "${raw}"`);
    const number = parseFloat(m[0]); i += m[0].length;
    let u = null;
    for (const s of KG) if (text.slice(i).startsWith(s)) { u = 'kg'; i += s.length; break; }
    if (!u) for (const s of G) if (text.slice(i).startsWith(s)) { u = 'g'; i += s.length; break; }
    segs.push({ number, unit: u });
    while (i < text.length && '+-و'.includes(text[i])) i += 1;
  }
  const hadUnit = segs.some((s) => s.unit);
  if (unit === 'piece') {
    if (hadUnit) throw new Error('هذا الصنف بالعدد، ما بينفع تكتب وحدة وزن (ك / غ)');
    if (!(segs[0].number > 0)) throw new Error('الكمية لازم تكون أكبر من صفر');
    return { value: round3(segs[0].number), raw };
  }
  const total = segs.reduce((s, x) => s + (x.unit === 'g' ? x.number / 1000 : x.number), 0);
  if (!(total > 0)) throw new Error('الكمية لازم تكون أكبر من صفر');
  return { value: round3(total), raw };
}
function parseAmount(input) {
  const t = normalizeDigits(String(input ?? '').trim()).replace(/\s/g, '');
  if (!/^[0-9]+(\.[0-9]+)?$/.test(t)) throw new Error(`مبلغ غير مفهوم: "${input}"`);
  const v = parseFloat(t);
  if (!(v > 0)) throw new Error('المبلغ لازم يكون أكبر من صفر');
  return round2(v);
}

const HOME = { admin: '/admin', recorder: '/record', viewer: '/overview', customer: '/customer' };

const fail = (status, message) => { const e = new Error(message); e.status = status; throw e; };
const canSeeStock = () => session && (session.role === 'admin' || session.role === 'viewer');

// ---------- المعالجات ----------
function listItems(q = {}) {
  let rows = db.items.filter((i) => (q.include_inactive === 'true' ? true : i.active));
  if (q.search) rows = rows.filter((i) => i.name.includes(q.search));
  if (q.letter) rows = rows.filter((i) => i.name.trim().startsWith(q.letter));
  return rows.map((i) => {
    const price = priceAt(i.id, new Date());
    const base = { id: i.id, name: i.name, unit: i.unit, active: i.active,
      has_recipe: db.item_components.some((c) => c.parent_item_id === i.id),
      last_movement_at: liveTxns().filter((t) => t.item_id === i.id)
        .map((t) => t.occurred_at).sort().pop() || null };
    if (canSeeStock()) return { ...base, quantity: stockOf(i.id), current_price: price };
    return { ...base, ...(session.role === 'recorder' ? { needs_price: price == null } : {}) };
  }).sort((a, b) => a.name.localeCompare(b.name, 'ar'));
}

function filterTxns(q = {}) {
  let rows = liveTxns();
  if (session.role === 'customer') rows = rows.filter((t) => t.entity_id === session.entity_id);
  else if (q.entity_id) rows = rows.filter((t) => t.entity_id === Number(q.entity_id));
  if (q.item_id) rows = rows.filter((t) => t.item_id === Number(q.item_id));
  if (q.kind) rows = rows.filter((t) => t.kind === q.kind);
  if (q.mine === 'true') rows = rows.filter((t) => t.created_by === session.id);
  if (q.from && q.to || q.week !== undefined) {
    const p = resolvePeriod(q);
    rows = rows.filter((t) => new Date(t.occurred_at) >= p.from && new Date(t.occurred_at) < p.to);
  }
  let out = rows.map(view);
  if (q.pending_price === 'true') out = out.filter((t) => t.price_pending);
  out.sort((a, b) => new Date(b.occurred_at) - new Date(a.occurred_at) || b.id - a.id);
  if (session.role === 'recorder') {
    out = out.map(({ unit_price, amount, price_pending, price_overridden, debt_delta, ...rest }) => rest);
  }
  return out.slice(0, Number(q.limit || 200));
}

function statementFor(entityId, q) {
  const entity = entityById(entityId);
  if (!entity) fail(404, 'الجهة غير موجودة');
  if (session.role === 'recorder') fail(403, 'ما عندك صلاحية تشوف الكشوفات');
  if (session.role === 'customer' && session.entity_id !== entityId) fail(403, 'بتقدر تشوف كشف حسابك بس');

  const period = resolvePeriod(q);
  const all = liveTxns().filter((t) => t.entity_id === entityId).map(view);
  const opening = round2(all.filter((t) => new Date(t.occurred_at) < period.from)
    .reduce((s, t) => s + t.debt_delta, 0));
  const inPeriod = all.filter((t) => new Date(t.occurred_at) >= period.from && new Date(t.occurred_at) < period.to)
    .sort((a, b) => new Date(a.occurred_at) - new Date(b.occurred_at) || a.id - b.id);

  let running = opening;
  const lines = inPeriod.map((l) => { running = round2(running + l.debt_delta); return { ...l, running_balance: running }; });
  const sum = (f) => round2(lines.reduce((s, r) => s + f(r), 0));

  return {
    entity, period, opening_balance: opening, lines,
    totals: {
      withdrawals: sum((r) => (r.kind === 'customer_out' ? r.amount || 0 : 0)),
      returns: sum((r) => (r.kind === 'customer_return' ? r.amount || 0 : 0)),
      payments: sum((r) => (r.kind === 'payment' ? r.payment_amount || 0 : 0)),
      pending_price_lines: lines.filter((r) => r.price_pending).length,
    },
    closing_balance: round2(running),
    financial: entity.has_financials,
  };
}

function lossReport(q) {
  const period = resolvePeriod(q);
  const inPeriod = liveTxns().filter((t) => new Date(t.occurred_at) >= period.from && new Date(t.occurred_at) < period.to);
  const outputBy = {}; const issuedBy = {};
  for (const t of inPeriod) {
    if (t.kind === 'operator_in') outputBy[t.item_id] = (outputBy[t.item_id] || 0) + t.quantity;
    if (t.kind === 'operator_out') issuedBy[t.item_id] = (issuedBy[t.item_id] || 0) + t.quantity;
  }
  const parents = {};
  for (const c of db.item_components) {
    (parents[c.parent_item_id] ||= []).push(c);
  }
  const requiredTotals = {};
  for (const [pid, comps] of Object.entries(parents)) {
    const actual = outputBy[pid] || 0;
    for (const c of comps) requiredTotals[c.component_item_id] = (requiredTotals[c.component_item_id] || 0) + actual * c.quantity_per_unit;
  }

  const production = [];
  for (const [pid, comps] of Object.entries(parents)) {
    const parent = itemById(pid);
    const actual = outputBy[pid] || 0;
    const anyIssued = comps.some((c) => (issuedBy[c.component_item_id] || 0) > 0);
    if (!actual && !anyIssued) continue;
    let expected = null;
    const components = comps.map((c) => {
      const required = round3(actual * c.quantity_per_unit);
      const issuedTotal = issuedBy[c.component_item_id] || 0;
      const totalReq = requiredTotals[c.component_item_id] || 0;
      const share = totalReq > 0 ? required / totalReq : 1;
      const allocated = round3(issuedTotal * share);
      const exp = c.quantity_per_unit > 0 ? allocated / c.quantity_per_unit : null;
      if (exp != null) expected = expected == null ? exp : Math.min(expected, exp);
      return { component_item_id: c.component_item_id, component_name: itemById(c.component_item_id).name,
        component_unit: itemById(c.component_item_id).unit, quantity_per_unit: c.quantity_per_unit,
        required, issued_total: round3(issuedTotal), allocated_issued: allocated,
        expected_output_from_component: exp == null ? null : round3(exp), difference: round3(allocated - required) };
    });
    const exp = expected == null ? null : round3(expected);
    const loss = exp == null ? null : round3(exp - actual);
    production.push({ item_id: Number(pid), item_name: parent.name, unit: parent.unit,
      actual_output: round3(actual), expected_output: exp, loss_units: loss,
      loss_percent: exp && exp > 0 ? round2((loss / exp) * 100) : null, components });
  }

  const components = Object.entries(requiredTotals).map(([cid, req]) => {
    const issued = issuedBy[cid] || 0;
    if (!issued && !req) return null;
    const price = priceAt(cid, period.to);
    const diff = round3(issued - req);
    return { item_id: Number(cid), item_name: itemById(cid).name, unit: itemById(cid).unit,
      issued: round3(issued), required: round3(req), difference: diff, price,
      loss_value: price == null ? null : round2(diff * price) };
  }).filter(Boolean);

  const unlinked = Object.keys(issuedBy).filter((id) => !(id in requiredTotals))
    .map((id) => ({ item_id: Number(id), item_name: itemById(id).name, unit: itemById(id).unit, issued: round3(issuedBy[id]) }));

  return { period, production, components, unlinked_issues: unlinked,
    summary: { total_loss_value: round2(components.reduce((s, c) => s + (c.loss_value || 0), 0)),
      items_with_loss: production.filter((p) => (p.loss_units || 0) > 0).length } };
}

function stockReport() {
  const items = db.items.filter((i) => i.active).map((i) => {
    const quantity = stockOf(i.id);
    const price = priceAt(i.id, new Date());
    return { item_id: i.id, item_name: i.name, unit: i.unit, active: i.active, quantity,
      current_price: price, negative: quantity < 0, needs_price: price == null,
      value: price == null ? null : round2(quantity * price),
      has_recipe: db.item_components.some((c) => c.parent_item_id === i.id),
      last_movement_at: liveTxns().filter((t) => t.item_id === i.id).map((t) => t.occurred_at).sort().pop() || null };
  }).sort((a, b) => a.item_name.localeCompare(b.item_name, 'ar'));
  return { items, summary: { total_items: items.length,
    negative_count: items.filter((i) => i.negative).length,
    missing_price_count: items.filter((i) => i.needs_price).length,
    total_value: round2(items.reduce((s, i) => s + (i.value || 0), 0)) } };
}

function bomCost(itemId, at) {
  const comps = db.item_components.filter((c) => c.parent_item_id === Number(itemId));
  if (!comps.length) return { cost: null, complete: false, lines: [] };
  let cost = 0; let complete = true;
  const lines = comps.map((c) => {
    const price = priceAt(c.component_item_id, at);
    if (price == null) complete = false; else cost += price * c.quantity_per_unit;
    return { component_item_id: c.component_item_id, component_name: itemById(c.component_item_id).name,
      component_unit: itemById(c.component_item_id).unit, quantity_per_unit: c.quantity_per_unit,
      component_price: price, line_cost: price == null ? null : round2(price * c.quantity_per_unit), id: c.id };
  });
  return { cost: round2(cost), complete, lines };
}

function setPrice(itemId, body) {
  const item = itemById(itemId);
  const effectiveFrom = body.effective_from || new Date().toISOString();
  const oldPrice = priceAt(itemId, effectiveFrom);
  db.item_prices.push({ id: nextId(), item_id: Number(itemId), price: Number(body.price),
    effective_from: effectiveFrom, note: body.note || null, created_by_name: session.display_name });

  const affected = liveTxns().filter((t) => t.item_id === Number(itemId) && t.unit_price_override == null
    && ['customer_out', 'customer_return'].includes(t.kind) && new Date(t.occurred_at) >= new Date(effectiveFrom)).length;

  // اقتراح سعر لكل صنف بيستعمل هالصنف بالوصفة (بيحافظ على نفس هامش الربح)
  const proposals = [];
  for (const c of db.item_components.filter((x) => x.component_item_id === Number(itemId))) {
    const parent = itemById(c.parent_item_id);
    const justBefore = new Date(new Date(effectiveFrom).getTime() - 1);
    const oldCost = db.item_components.filter((x) => x.parent_item_id === parent.id)
      .reduce((s, x) => s + (x.component_item_id === Number(itemId) ? (oldPrice || 0) : (priceAt(x.component_item_id, justBefore) || 0)) * x.quantity_per_unit, 0);
    const newCost = bomCost(parent.id, effectiveFrom).cost;
    const currentParentPrice = priceAt(parent.id, effectiveFrom);
    const suggested = currentParentPrice != null && oldCost > 0 && newCost != null
      ? round2(currentParentPrice * (newCost / oldCost)) : newCost;
    const p = { id: nextId(), parent_item_id: parent.id, parent_name: parent.name, parent_unit: parent.unit,
      component_item_id: Number(itemId), component_name: item.name, old_component_price: oldPrice,
      new_component_price: Number(body.price), current_parent_price: currentParentPrice,
      suggested_price: suggested, cost_price: newCost, old_cost: round2(oldCost),
      effective_from: effectiveFrom, status: 'pending', created_at: new Date().toISOString() };
    db.proposals.unshift(p);
    proposals.push(p);
    notify('price_change', `سعر "${item.name}" تغيّر`,
      `بدك تعدّل سعر "${parent.name}" المرتبط فيه؟ المقترح: ${suggested ?? '—'} (الحالي: ${currentParentPrice ?? '—'})`, true);
  }
  audit('update', 'item_prices', `تغيير سعر "${item.name}" من ${oldPrice ?? '—'} إلى ${body.price} اعتباراً من ${dateStr(effectiveFrom)}`,
    { before_data: { price: oldPrice }, after_data: { price: Number(body.price), effective_from: effectiveFrom } });
  return { ok: true, old_price: oldPrice, new_price: Number(body.price), effective_from: effectiveFrom,
    affected_transactions: affected, proposals };
}

function createTxn(body) {
  const kind = body.kind;
  if (body.client_token) {
    const dup = liveTxns().find((t) => t.client_token === body.client_token);
    if (dup) return { transaction: view(dup), warnings: [], duplicate: true };
  }
  const entity = kind === 'supply' ? null : entityById(body.entity_id);
  if (kind !== 'supply' && !entity) fail(400, 'الجهة غير موجودة');
  if (['customer_out', 'customer_return', 'payment'].includes(kind) && entity.type !== 'customer') {
    fail(400, 'هاي الحركة بتنسجّل على زبون مش على المشغل');
  }
  if (['operator_out', 'operator_in'].includes(kind) && entity.type !== 'operator') {
    fail(400, 'حركات المشغل بتنسجّل على المشغل بس');
  }

  const row = { kind, entity_id: entity ? entity.id : null, note: body.note || null,
    occurred_at: (session.role === 'admin' && body.occurred_at) ? body.occurred_at : new Date().toISOString(),
    created_by: session.id, created_by_name: session.display_name, client_token: body.client_token || null };

  if (kind === 'payment') {
    row.payment_amount = parseAmount(body.payment_amount ?? body.amount);
    if (!['cash', 'bank', 'check'].includes(body.method)) fail(400, 'لازم تحدد طريقة الدفع: نقدي / تحويل بنكي / شيك');
    row.method = body.method;
  } else {
    const item = itemById(body.item_id);
    if (!item) fail(400, 'الصنف غير موجود');
    const q = parseQuantity(body.quantity, item.unit);
    row.item_id = item.id; row.quantity = q.value; row.quantity_input = q.raw;
    if (session.role === 'admin' && body.unit_price_override != null && body.unit_price_override !== '') {
      row.unit_price_override = Number(body.unit_price_override);
    }
  }

  const saved = addTxn(row);
  const full = view(saved);
  audit('create', 'transactions', `${KIND_LABELS[kind]}${full.entity_name ? ' - ' + full.entity_name : ''}` +
    `${full.item_name ? ' - ' + full.item_name + ' × ' + saved.quantity_input : ''}` +
    `${saved.payment_amount ? ' - ' + saved.payment_amount : ''}`, { after_data: saved });

  const warnings = [];
  if (saved.item_id && stockOf(saved.item_id) < 0) {
    const item = itemById(saved.item_id);
    warnings.push({ level: 'danger', item_id: item.id, item_name: item.name,
      message: canSeeStock()
        ? `تنبيه: رصيد "${item.name}" صار بالسالب (${stockOf(item.id)})`
        : `تنبيه: الكمية المسحوبة أكتر من المتوفر بالمستودع لصنف "${item.name}"` });
    notify('negative_stock', 'رصيد صنف تحت الصفر', `"${item.name}" صار رصيده سالب بعد آخر حركة`);
  }
  if (full.price_pending) {
    notify('pending_price', 'حركة بسعر معلّق',
      `"${full.item_name}" ما إله سعر - حركة ${full.entity_name} ما بتنحسب لحد ما تحدّد السعر`, true);
  }
  return { transaction: session.role === 'recorder'
    ? (({ unit_price, amount, price_pending, price_overridden, debt_delta, ...r }) => r)(full) : full, warnings };
}

// ---------- الموجّه ----------
const routes = {
  'GET /api/config': () => ({ app_name: 'نظام مستودعات المفلح', currency: 'د.أ',
    timezone: TZ_api, user: session ? safeUser(session) : null }),

  'POST /api/auth/login': (b) => {
    const u = db.users.find((x) => x.username.toLowerCase() === String(b.username || '').trim().toLowerCase());
    if (!u || !u.active || u.password !== b.password) fail(401, 'اليوزر أو كلمة السر غلط');
    session = u;
    return { user: safeUser(u), home: HOME[u.role] };
  },
  'POST /api/auth/logout': () => { session = null; return { ok: true }; },
  'GET /api/auth/me': () => (session ? { user: safeUser(session), home: HOME[session.role] } : fail(401, 'مش مسجّل دخول')),
  'POST /api/auth/change-credentials': (b) => {
    if (b.current_password !== session.password) fail(401, 'كلمة السر الحالية غلط');
    if (b.new_password) {
      if (String(b.new_password).length < 8) fail(400, 'كلمة السر لازم تكون ٨ خانات على الأقل');
      if (!/[0-9]/.test(b.new_password)) fail(400, 'كلمة السر لازم تحتوي على رقم واحد على الأقل');
      session.password = b.new_password;
    }
    if (b.new_username) session.username = String(b.new_username).trim();
    audit('update', 'users', 'تغيير بيانات الدخول (ذاتي)');
    return { ok: true };
  },

  'GET /api/users/entities': () => ({ entities: db.entities.filter((e) => e.active) }),
  'GET /api/users': () => (session.role !== 'admin' ? fail(403, 'ما عندك صلاحية لهاي الصفحة')
    : { users: db.users.map((u) => ({ ...safeUser(u), password: u.password, active: u.active })) }),
  'POST /api/users': (b) => {
    if (db.users.some((u) => u.username === b.username)) fail(409, 'اليوزر موجود مسبقاً');
    const u = { id: nextId(), ...b, active: true };
    db.users.push(u); audit('create', 'users', `إنشاء حساب: ${b.display_name} (${b.role})`);
    return { user: safeUser(u) };
  },

  'GET /api/items': (b, q) => ({ items: listItems(q) }),
  'POST /api/items': (b) => {
    if (db.items.some((i) => i.name.trim().toLowerCase() === String(b.name).trim().toLowerCase())) fail(409, 'في صنف بنفس الاسم');
    const item = { id: nextId(), name: String(b.name).trim(), unit: b.unit === 'kg' ? 'kg' : 'piece', active: true };
    db.items.push(item);
    let price = null;
    if (session.role === 'admin' && b.price != null && b.price !== '') {
      price = Number(b.price);
      db.item_prices.push({ id: nextId(), item_id: item.id, price,
        effective_from: b.effective_from || new Date().toISOString(), note: 'سعر أوّلي', created_by_name: session.display_name });
    }
    audit('create', 'items', `إضافة صنف: ${item.name}`, { after_data: { ...item, price } });
    if (price == null) notify('pending_price', 'صنف جديد بدون سعر', `"${item.name}" انضاف من ${session.display_name} وبده سعر`, true);
    return { item: { ...item, current_price: price } };
  },

  'GET /api/transactions': (b, q) => ({ transactions: filterTxns(q) }),
  'GET /api/transactions/meta/kinds': () => ({
    kinds: Object.entries(KIND_LABELS).map(([value, label]) => ({ value, label })),
    methods: [{ value: 'cash', label: 'نقدي' }, { value: 'bank', label: 'تحويل بنكي' }, { value: 'check', label: 'شيك' }],
    week_start: 'السبت' }),
  'POST /api/transactions': (b) => createTxn(b),

  'GET /api/stock': () => (canSeeStock() ? stockReport() : fail(403, 'ما عندك صلاحية لهاي الصفحة')),
  'GET /api/statements': (b, q) => {
    if (session.role === 'customer') return statementFor(session.entity_id, q);
    if (session.role === 'recorder') fail(403, 'ما عندك صلاحية تشوف الأرصدة');
    const period = resolvePeriod(q);
    const customers = db.entities.filter((e) => e.type === 'customer').map((e) => {
      const all = liveTxns().filter((t) => t.entity_id === e.id).map(view);
      const inP = all.filter((t) => new Date(t.occurred_at) >= period.from && new Date(t.occurred_at) < period.to);
      return { entity_id: e.id, entity_name: e.name, type: e.type, has_financials: e.has_financials,
        balance: balanceOf(e.id),
        total_withdrawn: round2(all.filter((t) => t.kind === 'customer_out').reduce((s, t) => s + (t.amount || 0), 0)),
        total_paid: round2(all.filter((t) => t.kind === 'payment').reduce((s, t) => s + t.payment_amount, 0)),
        total_returned: round2(all.filter((t) => t.kind === 'customer_return').reduce((s, t) => s + (t.amount || 0), 0)),
        pending_price_count: all.filter((t) => t.price_pending).length,
        opening_balance: round2(all.filter((t) => new Date(t.occurred_at) < period.from).reduce((s, t) => s + t.debt_delta, 0)),
        period_change: round2(inP.reduce((s, t) => s + t.debt_delta, 0)) };
    });
    return { period, customers, totals: {
      balance: round2(customers.reduce((s, c) => s + c.balance, 0)),
      total_withdrawn: round2(customers.reduce((s, c) => s + c.total_withdrawn, 0)),
      total_paid: round2(customers.reduce((s, c) => s + c.total_paid, 0)) } };
  },
  'GET /api/reports/loss': (b, q) => (canSeeStock() ? lossReport(q) : fail(403, 'ما عندك صلاحية لهاي الصفحة')),
  'GET /api/audit': (b, q) => {
    if (session.role !== 'admin') fail(403, 'ما عندك صلاحية لهاي الصفحة');
    let rows = db.audit;
    if (q.action) rows = rows.filter((a) => a.action === q.action);
    return { entries: rows.slice(0, Number(q.limit || 300)) };
  },
  'GET /api/proposals': (b, q) => ({ proposals: db.proposals.filter((p) => (q.status || 'pending') === 'all' || p.status === (q.status || 'pending')) }),
  'GET /api/requests': (b, q) => {
    let rows = db.requests;
    if (session.role === 'customer') rows = rows.filter((r) => r.entity_id === session.entity_id);
    if (q.open_only === 'true') rows = rows.filter((r) => !r.handled);
    return { requests: rows };
  },
  'POST /api/requests': (b) => {
    const r = { id: nextId(), entity_id: session.entity_id, entity_name: entityById(session.entity_id).name,
      user_name: session.display_name, body: String(b.body).trim(), handled: false, created_at: new Date().toISOString() };
    db.requests.unshift(r);
    notify('customer_request', `طلب/ملاحظة من ${r.entity_name}`, r.body.slice(0, 180), true);
    return { request: r };
  },
  'GET /api/notifications': (b, q) => {
    const mine = db.notifications.filter((n) => n.user_id === session.id);
    return { notifications: mine.slice(0, Number(q.limit || 50)), unread: mine.filter((n) => !n.read_at).length };
  },
  'GET /api/notifications/count': () => ({ unread: db.notifications.filter((n) => n.user_id === session.id && !n.read_at).length }),
  'POST /api/notifications/read-all': () => {
    db.notifications.filter((n) => n.user_id === session.id).forEach((n) => { n.read_at = new Date().toISOString(); });
    return { ok: true };
  },
};

/** مسارات فيها معرّف متغيّر */
function dynamic(method, path, body, query) {
  let m;
  if ((m = path.match(/^\/api\/statements\/(\d+)$/)) && method === 'GET') return statementFor(Number(m[1]), query);
  if ((m = path.match(/^\/api\/stock\/(\d+)$/)) && method === 'GET') {
    const item = stockReport().items.find((i) => i.item_id === Number(m[1]));
    return { item, movements: filterTxns({ item_id: m[1], limit: 50 }), ...bomCost(m[1], new Date()) };
  }
  if ((m = path.match(/^\/api\/items\/(\d+)\/prices$/))) {
    if (method === 'GET') return { prices: db.item_prices.filter((p) => p.item_id === Number(m[1]))
      .sort((a, b) => new Date(b.effective_from) - new Date(a.effective_from)) };
    if (method === 'POST') return setPrice(Number(m[1]), body);
  }
  if ((m = path.match(/^\/api\/items\/(\d+)\/recipe$/))) {
    const id = Number(m[1]);
    if (method === 'GET') {
      const cost = bomCost(id, new Date());
      const current = priceAt(id, new Date());
      return { components: cost.lines, cost: cost.cost, cost_complete: cost.complete,
        current_price: current, margin: current != null && cost.cost ? round2(current - cost.cost) : null };
    }
    if (method === 'PUT') {
      db.item_components = db.item_components.filter((c) => c.parent_item_id !== id);
      for (const c of (body.components || [])) {
        db.item_components.push({ id: nextId(), parent_item_id: id,
          component_item_id: Number(c.component_item_id), quantity_per_unit: Number(c.quantity_per_unit) });
      }
      audit('update', 'item_components', 'تعديل مقادير الصنف');
      const cost = bomCost(id, new Date());
      return { ok: true, cost: cost.cost, cost_complete: cost.complete };
    }
  }
  if ((m = path.match(/^\/api\/items\/(\d+)$/)) && method === 'PATCH') {
    const item = itemById(m[1]);
    const before = { ...item };
    Object.assign(item, { name: body.name ?? item.name, unit: body.unit ?? item.unit,
      active: body.active ?? item.active });
    audit('update', 'items', `تعديل صنف: ${before.name}`, { before_data: before, after_data: { ...item } });
    return { item, changes: {} };
  }
  if ((m = path.match(/^\/api\/transactions\/(\d+)$/))) {
    const txn = db.transactions.find((t) => t.id === Number(m[1]) && !t.deleted_at);
    if (!txn) fail(404, 'الحركة غير موجودة');
    if (method === 'PATCH') {
      const before = { ...txn };
      if (body.quantity !== undefined) {
        const q = parseQuantity(body.quantity, itemById(txn.item_id).unit);
        txn.quantity = q.value; txn.quantity_input = q.raw;
      }
      if (body.payment_amount !== undefined && body.payment_amount !== null) txn.payment_amount = parseAmount(body.payment_amount);
      if (body.note !== undefined) txn.note = body.note || null;
      if (body.occurred_at && session.role === 'admin') txn.occurred_at = body.occurred_at;
      if (body.unit_price_override !== undefined) {
        txn.unit_price_override = body.unit_price_override === null || body.unit_price_override === ''
          ? null : Number(body.unit_price_override);
      }
      audit('update', 'transactions', `تعديل حركة #${txn.id} (${KIND_LABELS[txn.kind]})`,
        { before_data: before, after_data: { ...txn } });
      const warnings = [];
      if (txn.item_id && stockOf(txn.item_id) < 0) {
        warnings.push({ level: 'danger', message: `تنبيه: رصيد "${itemById(txn.item_id).name}" صار بالسالب` });
      }
      return { transaction: view(txn), changes: {}, warnings };
    }
    if (method === 'DELETE') {
      txn.deleted_at = new Date().toISOString();
      const v = view(txn);
      audit('delete', 'transactions', `حذف حركة #${txn.id} (${KIND_LABELS[txn.kind]}` +
        `${v.entity_name ? ' - ' + v.entity_name : ''}${v.amount ? ' - ' + v.amount : ''})`, { before_data: v });
      return { ok: true };
    }
  }
  if ((m = path.match(/^\/api\/users\/(\d+)$/)) && method === 'PATCH') {
    const u = db.users.find((x) => x.id === Number(m[1]));
    if (body.password) u.password = body.password;
    if (body.username) u.username = body.username;
    if (body.active != null) u.active = body.active;
    if (body.notifications_on != null) u.notifications_on = body.notifications_on;
    audit('update', 'users', `تعديل حساب: ${u.display_name}`);
    return { user: safeUser(u) };
  }
  if ((m = path.match(/^\/api\/requests\/(\d+)$/)) && method === 'PATCH') {
    const r = db.requests.find((x) => x.id === Number(m[1]));
    r.handled = body.handled !== false;
    r.handled_by_name = session.display_name;
    return { request: r };
  }
  if ((m = path.match(/^\/api\/proposals\/(\d+)\/accept$/))) {
    const p = db.proposals.find((x) => x.id === Number(m[1]));
    if (!p || p.status !== 'pending') fail(409, 'الاقتراح غير موجود أو تم البتّ فيه مسبقاً');
    p.status = 'accepted';
    db.item_prices.push({ id: nextId(), item_id: p.parent_item_id,
      price: body.price != null ? Number(body.price) : p.suggested_price,
      effective_from: body.effective_from || p.effective_from,
      note: 'تعديل تلقائي بعد تغيّر سعر المقادير', created_by_name: session.display_name });
    audit('update', 'price_proposals', `قبول تعديل سعر "${p.parent_name}"`);
    return { ok: true };
  }
  if ((m = path.match(/^\/api\/proposals\/(\d+)\/reject$/))) {
    const p = db.proposals.find((x) => x.id === Number(m[1]));
    if (p) p.status = 'rejected';
    return { ok: true };
  }
  if ((m = path.match(/^\/api\/notifications\/(\d+)\/read$/))) {
    const n = db.notifications.find((x) => x.id === Number(m[1]));
    if (n) n.read_at = new Date().toISOString();
    return { ok: true };
  }
  fail(404, 'الصفحة أو العملية غير موجودة');
}

async function handle(method, url, body) {
  await delay();
  const [path, queryString] = String(url).split('?');
  const query = Object.fromEntries(new URLSearchParams(queryString || ''));
  if (!session && !['POST /api/auth/login', 'GET /api/config'].includes(`${method} ${path}`)) {
    fail(401, 'لازم تسجّل دخول');
  }
  const handler = routes[`${method} ${path}`];
  if (handler) return handler(body, query);
  return dynamic(method, path, body, query);
}

const api = {
  get: (p, params) => {
    const clean = Object.entries(params || {}).filter(([, v]) => v !== undefined && v !== null && v !== '');
    return handle('GET', p + (clean.length ? '?' + new URLSearchParams(clean) : ''));
  },
  post: (p, b) => handle('POST', p, b),
  patch: (p, b) => handle('PATCH', p, b),
  put: (p, b) => handle('PUT', p, b),
  del: (p) => handle('DELETE', p),
  login: (username, password) => handle('POST', '/api/auth/login', { username, password }),
  logout: () => handle('POST', '/api/auth/logout'),
  me: () => handle('GET', '/api/auth/me'),
};

/** شريط اختيار الفترة: أسبوعي (يبلّش السبت) أو مدى مخصّص */
function periodPicker(onChange) {
  let mode = 'week';
  let offset = 0;
  const from = h('input', { type: 'date', value: todayString() });
  const to = h('input', { type: 'date', value: todayString() });
  const customBox = h('div.row', { style: 'display:none' },
    h('label.field', {}, 'من', from),
    h('label.field', {}, 'إلى', to),
    h('button.btn.sm', { onclick: () => emit() }, 'اعرض'));

  const buttons = h('div.row');
  const emit = () => onChange(mode === 'week' ? { week: offset } : { from: from.value, to: to.value });

  const setMode = (newMode, newOffset = 0) => {
    mode = newMode; offset = newOffset;
    customBox.style.display = mode === 'custom' ? 'flex' : 'none';
    for (const b of buttons.querySelectorAll('button')) b.classList.remove('gold');
    buttons.querySelector(`[data-key="${mode}${mode === 'week' ? offset : ''}"]`)?.classList.add('gold');
    if (mode !== 'custom') emit();
  };

  buttons.append(
    h('button.btn.ghost.sm', { dataset: { key: 'week0' }, onclick: () => setMode('week', 0) }, 'هذا الأسبوع'),
    h('button.btn.ghost.sm', { dataset: { key: 'week-1' }, onclick: () => setMode('week', -1) }, 'الأسبوع اللي فات'),
    h('button.btn.ghost.sm', { dataset: { key: 'week-2' }, onclick: () => setMode('week', -2) }, 'قبل أسبوعين'),
    h('button.btn.ghost.sm', { dataset: { key: 'custom' }, onclick: () => setMode('custom') }, 'فترة مخصّصة'),
  );

  const box = h('div', {}, buttons, customBox);
  setTimeout(() => setMode('week', 0), 0);
  return box;
}

/** سجل الحركات */
async function renderTransactions(root, { editable = false, onEdit, onDelete } = {}) {
  clear(root);
  const box = h('div');
  const filters = h('div.row');
  let params = { week: 0 };

  const entitySelect = h('select', { onchange: () => refresh() }, h('option', { value: '' }, 'كل الجهات'));
  const kindSelect = h('select', { onchange: () => refresh() }, h('option', { value: '' }, 'كل الأنواع'));

  const { entities } = await api.get('/api/users/entities');
  for (const e of entities) entitySelect.append(h('option', { value: e.id }, e.name));
  const { kinds } = await api.get('/api/transactions/meta/kinds');
  for (const k of kinds) kindSelect.append(h('option', { value: k.value }, k.label));

  filters.append(
    h('label.field', {}, 'الجهة', entitySelect),
    h('label.field', {}, 'نوع الحركة', kindSelect));

  const picker = periodPicker((p) => { params = p; refresh(); });
  root.append(h('div.card.no-print', {}, h('h3', {}, 'فلترة'), picker, filters), box);

  async function refresh() {
    const data = await api.get('/api/transactions', {
      ...params, entity_id: entitySelect.value, kind: kindSelect.value, limit: 500,
    });
    clear(box);
    const columns = [
      { label: '#', key: 'id' },
      { label: 'التاريخ والوقت', render: (r) => dateTime(r.occurred_at) },
      { label: 'النوع', render: (r) => h('span.pill', { class: KIND_PILL[r.kind] || '' }, r.kind_label) },
      { label: 'الجهة', render: (r) => r.entity_name || 'المستودع' },
      { label: 'الصنف', render: (r) => r.item_name || '—' },
      { label: 'الكمية', cls: 'num', render: (r) => (r.quantity == null ? '—' : qty(r.quantity, r.item_unit)) },
      { label: 'سعر الوحدة', cls: 'num', render: (r) => (r.price_pending ? h('span.pill.warn', {}, 'معلّق') : money(r.unit_price)) },
      { label: 'المبلغ', cls: 'num', render: (r) => money(r.amount ?? r.payment_amount) },
      { label: 'سجّلها', render: (r) => r.created_by_name || '—' },
      { label: 'ملاحظة', render: (r) => r.note || '—' },
    ];
    if (editable) {
      columns.push({
        label: '', cls: 'no-print', render: (r) => h('div.row', {},
          h('button.btn.ghost.sm', { onclick: () => onEdit(r, refresh) }, 'تعديل'),
          h('button.btn.danger.sm', { onclick: () => onDelete(r, refresh) }, 'حذف')),
      });
    }
    box.append(h('div.card', {},
      h('h3', {}, 'الحركات', h('span.sub', {}, `${data.transactions.length} حركة`)),
      table(columns, data.transactions, { empty: 'ما في حركات' })));
  }

  refresh();
  return { refresh };
}

function renderLogin(root, onSuccess) {
  clear(root);

  const username = h('input', { type: 'text', name: 'username', autocomplete: 'username', required: true, autocapitalize: 'off' });
  const password = h('input', { type: 'password', name: 'password', autocomplete: 'current-password', required: true });
  const error = h('div.alert.danger', { style: 'display:none' });
  const button = h('button.btn', { type: 'submit' }, 'دخول');

  const logoImg = h('img.logo', { src: state.logo, alt: 'المفلح' });

  const form = h('form', {
    onsubmit: async (e) => {
      e.preventDefault();
      error.style.display = 'none';
      button.disabled = true;
      button.textContent = 'جاري الدخول…';
      try {
        await api.login(username.value.trim(), password.value);
        toast('أهلاً فيك');
        onSuccess();
      } catch (err) {
        error.textContent = err.message;
        error.style.display = 'block';
        password.value = '';
        password.focus();
      } finally {
        button.disabled = false;
        button.textContent = 'دخول';
      }
    },
  },
    h('label.field', {}, 'اسم المستخدم', username),
    h('label.field', {}, 'كلمة السر', password),
    error,
    button);

  root.append(h('div.login-wrap', {},
    h('div.login-card', {},
      logoImg,
      h('h1', {}, 'نظام مستودعات المفلح'),
      form)));

  setTimeout(() => username.focus(), 50);
}

  { key: 'stock', label: 'الستوك', render: renderStock },
  { key: 'transactions', label: 'الحركات', render: renderAdminTransactions },

function renderAdmin(root) {
  clear(root);
  const tabsBar = h('div.tabs');
  const page = h('div.page');
  root.append(tabsBar, page);

  let active = 'dashboard';
  const draw = () => {
    clear(tabsBar);
    for (const tab of TABS) {
      tabsBar.append(h('button', {
        class: active === tab.key ? 'active' : '',
        onclick: () => { active = tab.key; draw(); },
      }, tab.label));
    }
    clear(page);
    const loading = h('div.empty', {}, 'جاري التحميل…');
    page.append(loading);
    Promise.resolve(TABS.find((t) => t.key === active).render(page))
      .catch((err) => { clear(page); page.append(h('div.alert.danger', {}, err.message)); });
  };
  draw();
}

        { label: '', render: (r) => h('div.row', {},
          h('button.btn.sm', { onclick: () => acceptProposal(r) }, 'وافق'),

      table([

        { label: 'الصنف', key: 'item_name' },
        { label: 'الكمية', cls: 'num', render: (r) => qty(r.quantity, r.item_unit) },
        { label: '', render: (r) => h('button.btn.gold.sm', {

        }, 'حدّد السعر') },

async function acceptProposal(proposal) {
  const price = h('input', { type: 'number', step: '0.01', value: proposal.suggested_price ?? '' });
  const effective = h('input', { type: 'date', value: dateOnly(proposal.effective_from) });
  const result = await modal({
    title: `تعديل سعر ${proposal.parent_name}`,
    confirmText: 'اعتمد السعر',
    body: h('div.grid', {},
      h('div.muted', {}, `تكلفة المقادير الجديدة: ${money(proposal.cost_price)} — السعر الحالي: ${money(proposal.current_parent_price)}`),
      h('label.field', {}, 'السعر الجديد', price),
      h('label.field', {}, 'يسري من تاريخ', effective),
      h('div.alert.warn', {}, 'كل الحركات من هذا التاريخ وجاي بتتحدّث تلقائياً بالسعر الجديد.')),
    onConfirm: async () => {
      await api.post(`/api/proposals/${proposal.id}/accept`, {
        price: Number(price.value),
        effective_from: inputToIso(effective.value),
      });
      toast('تم تعديل السعر');
    },
  });
  if (result) renderAdmin(document.getElementById('page-body'));
}

async function renderAdminTransactions(root) {
  await renderTransactions(root, {
    editable: true,
    onEdit: (txn, refresh) => openEditTransaction(txn, refresh),
    onDelete: async (txn, refresh) => {
      const ok = await confirmDialog(
        `حذف ${txn.kind_label} — ${txn.entity_name || 'المستودع'} — ${txn.item_name || money(txn.payment_amount)}؟ الأرصدة بتتحدّث تلقائياً.`,
        'حذف');
      if (!ok) return;
      await api.del(`/api/transactions/${txn.id}`);
      toast('تم الحذف');
      refresh();
    },
  });
}

function openEditTransaction(txn, refresh) {
  const isPayment = txn.kind === 'payment';
  const quantity = h('input', { type: 'text', value: txn.quantity_input || txn.quantity || '' });
  const amount = h('input', { type: 'text', value: txn.payment_amount ?? '' });
  const override = h('input', { type: 'number', step: '0.01', value: txn.price_overridden ? txn.unit_price : '' });
  const when = h('input', { type: 'datetime-local', value: toDateTimeInput(txn.occurred_at) });
  const note = h('input', { type: 'text', value: txn.note || '' });

  return modal({
    title: `تعديل حركة #${txn.id}`,
    confirmText: 'حفظ',
    body: h('div.grid', {},
      h('div.muted', {}, `${txn.kind_label} — ${txn.entity_name || 'المستودع'} — ${txn.item_name || ''}`),
      isPayment ? h('label.field', {}, 'المبلغ', amount) : h('label.field', {}, 'الكمية', quantity),
      isPayment ? null : h('label.field', {}, 'سعر استثنائي لهاي الحركة (اختياري)', override),
      h('label.field', {}, 'التاريخ والوقت', when),
      h('label.field', {}, 'ملاحظة', note),
      h('div.alert.warn', {}, 'التعديل بينسجّل بسجل التدقيق وبيعيد حساب الأرصدة رجوعاً وللأمام.')),
    onConfirm: async () => {
      const payload = { note: note.value.trim(), occurred_at: inputToIso(when.value) };
      if (isPayment) payload.payment_amount = amount.value.trim();
      else {
        payload.quantity = quantity.value.trim();
        payload.unit_price_override = override.value === '' ? null : Number(override.value);
      }
      const result = await api.patch(`/api/transactions/${txn.id}`, payload);
      if (result.warnings?.length) toast(result.warnings[0].message, true);
      toast('تم التعديل');
      refresh();
    },
  });
}

/** تغيير السعر - بيسأل دايماً "من متى" */
function openPriceDialog(item, refresh) {
  const price = h('input', { type: 'number', step: '0.01', min: '0', placeholder: 'السعر الجديد' });
  const effective = h('input', { type: 'date', value: todayString() });
  const note = h('input', { type: 'text', placeholder: 'سبب التغيير (اختياري)' });
  const preview = h('div.muted');

  const modeRow = h('div.row', {},
    h('button.btn.ghost.sm', { onclick: () => { effective.value = todayString(); update(); } }, 'من اليوم'),
    h('button.btn.ghost.sm', {
      onclick: () => { effective.value = weekStartString(); update(); },
    }, 'من بداية الأسبوع'));

  const update = () => {
    preview.textContent = `الحركات من ${effective.value} وجاي بتتحسب بالسعر الجديد، واللي قبله بتضل بسعرها القديم.`;
  };
  effective.addEventListener('change', update);
  update();

  return modal({
    title: `تغيير سعر: ${item.name}`,
    confirmText: 'حفظ السعر',
    body: h('div.grid', {},
      h('label.field', {}, 'السعر الجديد', price),
      h('label.field', {}, 'يسري من تاريخ', effective),
      modeRow,
      h('label.field', {}, 'ملاحظة', note),
      preview),
    onConfirm: async () => {
      if (price.value === '') throw new Error('أدخل السعر');
      const result = await api.post(`/api/items/${item.id}/prices`, {
        price: Number(price.value),
        effective_from: inputToIso(effective.value),
        note: note.value.trim() || undefined,
      });
      let message = `تم. ${result.affected_transactions} حركة تحدّثت.`;
      if (result.proposals?.length) message += ` وفي ${result.proposals.length} صنف مرتبط بده قرار منك.`;
      toast(message);
      refresh?.();
    },
  });
}

async function renderRecipes(root) {
  clear(root);
  const { items } = await api.get('/api/items');
  const select = h('select', { onchange: () => load(Number(select.value)) },
    h('option', { value: '' }, 'اختار صنف…'),
    items.map((i) => h('option', { value: i.id }, i.name)));
  const box = h('div');

  root.append(h('div.card.no-print', {},
    h('h3', {}, 'مقادير الأصناف', h('span.sub', {}, 'شو بده الصنف الجاهز من مواد خام لكل وحدة')),
    h('div.row', {}, h('label.field', {}, 'الصنف الجاهز', select))), box);

  async function load(itemId) {
    clear(box);
    if (!itemId) return;
    const item = items.find((i) => i.id === itemId);
    const data = await api.get(`/api/items/${itemId}/recipe`);
    const rows = data.components.map((c) => ({ ...c }));

    const listBox = h('div');
    const drawList = () => {
      clear(listBox);
      listBox.append(table([
        { label: 'المكوّن', key: 'component_name' },
        { label: 'الكمية لكل وحدة', cls: 'num', render: (r) => qty(r.quantity_per_unit, r.component_unit) },
        { label: '', render: (r) => h('button.btn.danger.sm', {
          onclick: () => { rows.splice(rows.indexOf(r), 1); drawList(); },
        }, 'حذف') },
      ], rows, { empty: 'ما في مقادير محدّدة لهذا الصنف' }));
    };
    drawList();

    const componentSelect = h('select', {},
      items.filter((i) => i.id !== itemId).map((i) => h('option', { value: i.id }, i.name)));
    const quantityInput = h('input', { type: 'number', step: '0.0001', min: '0', placeholder: 'الكمية' });

    box.append(h('div.card', {},
      h('h3', {}, `مقادير: ${item.name}`),
      h('div.grid.cols-4', { style: 'margin-bottom:12px' },
        stat('تكلفة المقادير', money(data.cost)),
        stat('سعر البيع الحالي', money(data.current_price)),
        stat('هامش الربح', money(data.margin))),
      !data.cost_complete && data.components.length
        ? h('div.alert.warn', {}, 'في مكوّن ما إله سعر — التكلفة مش كاملة.') : null,
      listBox,
      h('div.row', { style: 'margin-top:12px' },
        h('label.field', {}, 'مكوّن', componentSelect),
        h('label.field', {}, 'الكمية لكل وحدة', quantityInput),
        h('button.btn.ghost', {
          onclick: () => {
            const id = Number(componentSelect.value);
            const q = Number(quantityInput.value);
            if (!(q > 0)) return toast('أدخل كمية صحيحة', true);
            if (rows.some((r) => r.component_item_id === id)) return toast('المكوّن مضاف مسبقاً', true);
            const src = items.find((i) => i.id === id);
            rows.push({ component_item_id: id, component_name: src.name, component_unit: src.unit, quantity_per_unit: q });
            quantityInput.value = '';
            drawList();
          },
        }, '+ إضافة مكوّن')),
      h('div.row', { style: 'margin-top:14px' },
        h('button.btn', {
          onclick: async () => {
            await api.put(`/api/items/${itemId}/recipe`, {
              components: rows.map((r) => ({ component_item_id: r.component_item_id, quantity_per_unit: r.quantity_per_unit })),
            });
            toast('انحفظت المقادير');
            load(itemId);
          },
        }, 'حفظ المقادير'))));
  }
}
